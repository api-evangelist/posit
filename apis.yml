aid: posit
name: Posit
description: >-
  Posit, PBC (formerly RStudio) builds open-source and enterprise software for
  data science teams working in R and Python. Its professional products —
  Posit Workbench, Posit Connect, and Posit Package Manager (bundled as Posit
  Team), plus Posit Cloud and the Positron IDE — help organizations develop,
  publish, and govern data science work. Posit Connect exposes a full REST
  Server API (the Connect API) for automating content publishing, deployment
  bundles, users and groups, permissions, jobs, environments, tags, audit logs,
  and API keys, authenticated with per-user API keys. Posit also stewards
  widely used open-source projects including the Tidyverse, Shiny, Quarto, and
  tidymodels.

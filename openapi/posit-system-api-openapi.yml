openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference System API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: System
paths:
  /v1/system/storage:
    get:
      description: 'Returns aggregate bundle storage metrics for the Connect server.


        This endpoint provides total, active, and inactive bundle byte counts

        along with overall bundle and content item counts. It is useful for

        capacity planning and understanding server-wide storage usage.


        This endpoint requires authentication and is only available to users

        with the `administrator` role.'
      operationId: getServerStorage
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStorageSummary'
          description: Successful response.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get server storage
      tags:
      - System
components:
  schemas:
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    ServerStorageBundles:
      additionalProperties: false
      description: Bundle storage metrics.
      properties:
        bytes_total:
          description: Total bytes across all bundle archives with recorded sizes.
          example: 12345678900
          format: int64
          type: integer
        bytes_active:
          description: Bytes used by currently active (deployed) bundles.
          example: 4345678900
          format: int64
          type: integer
        bytes_inactive:
          description: Bytes used by inactive (historical) bundles.
          example: 8000000000
          format: int64
          type: integer
        count:
          description: Total number of bundles with recorded sizes.
          example: 8420
          type: integer
        content_count:
          description: Number of distinct content items with bundles.
          example: 542
          type: integer
      type: object
    ServerStorageSummary:
      additionalProperties: false
      description: Aggregate storage metrics for the Connect server.
      properties:
        bundles:
          allOf:
          - $ref: '#/components/schemas/ServerStorageBundles'
          description: Bundle storage metrics.
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

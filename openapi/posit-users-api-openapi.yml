openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference Users API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: Users
paths:
  /v1/user:
    get:
      description: Get detailed information on the requesting user.
      operationId: getCurrentUser
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get current user details
      tags:
      - Users
  /v1/users:
    get:
      description: 'This endpoint lists local users. When called with a prefix

        parameter, it searches for local users matching the prefix.


        By default, results are sorted by first name, then last name, then

        username, then email. Use the `sort` parameter to sort by a

        different field. When `prefix` is specified and `sort` is not,

        results are ordered by relevance to the prefix. When both `prefix`

        and `sort` are specified, the `sort` field takes precedence. The

        `prefix` can also be an exact match for the user''s DN (for LDAP)

        or the auth provider''s unique ID for the user, if any.


        - The `email` field is not populated for non-admins when

        `Server.HideEmailAddresses` is enabled.

        - The `external_id` field is only visible to administrators and to users

        viewing their own record.

        - When the user making the request is a viewer and

        `Authorization.ViewersCanOnlySeeThemselves` is being used,

        the results contain only the given user.


        This endpoint uses offset pagination. Requests can include

        query-string parameters for `page_number` and `page_size` to

        fetch different pages of results.


        Note that searching by `prefix` will only return the first page of

        results; subsequent pages will be empty. Set `page_size` to its

        maximum (`500`) to retrieve the most results.


        #### Service tokens


        This endpoint can be accessed using a service token with the

        `users:read` scope. When accessed with a service token, all

        users are returned unscrubbed. CSV export is not available.


        #### CSV export


        Administrators can request the response as CSV by setting the `Accept`

        header to `text/csv`. The CSV export ignores pagination parameters and

        returns all matching users.


        ```bash

        curl -H "Authorization: Key ${API_KEY}" \

        -H "Accept: text/csv" \

        "https://connect.example.com/__api__/v1/users"

        ```'
      operationId: getUsers
      parameters:
      - description: Filter by a prefix string matched against username, first name, last name, provider key, and DN.
        in: query
        name: prefix
        schema:
          type: string
      - description: The page number to return.
        in: query
        name: page_number
        schema:
          default: 1
          format: int32
          type: integer
      - description: The number of items per page.
        in: query
        name: page_size
        schema:
          default: 20
          format: int32
          type: integer
      - description: Whether results are in ascending order.
        in: query
        name: asc_order
        schema:
          default: true
          type: boolean
      - description: Sort results by field. Defaults to `first_name`. When `prefix` is specified and `sort` is not, results are ordered by search relevance score instead.
        in: query
        name: sort
        schema:
          enum:
          - first_name
          - last_name
          - username
          - active_time
          - created_time
          - user_role
          type: string
      - description: Filter by user role. `|` represents logical OR.
        in: query
        name: user_role
        schema:
          enum:
          - administrator
          - publisher
          - viewer
          type: string
      - description: Filter by account status. `|` represents logical OR.
        in: query
        name: account_status
        schema:
          enum:
          - locked
          - licensed
          - inactive
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List or search for user details
      tags:
      - Users
    post:
      description: 'This endpoint creates the given user.


        - This endpoint is used only for SAML, OAuth2 (non-Google), password, PAM, and proxied

        authentication. All other authentication providers should

        use the PUT /v1/users endpoint.

        - Administrator access is required to create *other* users.


        #### Initial User Creation Workflow


        This endpoint requires authentication to create *other* users,

        which means that you need an API key for access. How do you

        get an API key if there are no users in Posit Connect?


        - For password authentication, you can use this endpoint

        without an API key to create the first user. The first user

        will be an administrator.

        - For SAML, OAuth2 (non-Google), PAM or proxied authentication, the first user can be

        created by logging into Posit Connect. The API cannot be used.


        Once the first user is created, an API key can be used to access this

        endpoint and create subsequent users. The API

        Keys chapter of the Posit Connect User Guide

        explains how to create an API key.


        #### All Authentication Providers


        - When `user_role` is not specified, it will default to the

        role specified by the config setting

        `Authorization.DefaultUserRole`.


        #### SAML, OAuth2 (non-Google), PAM and Proxied Authentication


        - An API key must always be used. Users cannot use this

        endpoint to create their own account.

        - Administrator access is always required to create accounts.

        - `external_id` is required for SAML and OAuth2 (non-Google)

        authentication, and also for proxied authentication if the

        `ProxyAuth.UniqueIdHeader` config setting is used.

        It is not required for PAM, nor for proxied

        authentication without the `ProxyAuth.UniqueIdHeader` setting.


        #### Password Authentication


        - Users must confirm their account through an email. This

        feature is unique to password authentication.

        - Administrator access is always required except for the first

        created user.'
      operationId: createPushUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreatePushInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The request could not be completed due to a conflict.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Create a user from caller-supplied details (SAML, password, PAM, proxied…
      tags:
      - Users
    put:
      description: 'This endpoint creates the given user on the Posit Connect server.


        - This endpoint is used only for LDAP and OAuth2 with Google

        authentication. All other authentication providers should

        use the POST /v1/users endpoint.

        - Unlike the POST /v1/users endpoint, publisher or administrator

        access is required to access this endpoint.


        #### User Creation Workflow on LDAP and OAuth2 with Google


        This endpoint requires authentication, which means that you need an

        API key for access. How do you get an API key if there are no users in

        Posit Connect? The first user can be created by simply logging into

        Posit Connect. The Posit Connect Server API cannot be used to

        create the first user. Once logged in, you can create an API key.


        For LDAP and OAuth2 with Google, the API lets you identify an existing

        user in the LDAP or OAuth2 with Google system and create a corresponding

        account on Posit Connect. This is a two-step process:


        - Use the GET /v1/users/remote endpoint. This

        endpoint will return a list of potential matching accounts

        in LDAP or OAuth2 with Google. A user with no account on Posit Connect will

        lack a `guid`. Note the `temp_ticket` for the desired user

        account.

        - Use this PUT endpoint with the `temp_ticket` to create a

        corresponding account on Posit Connect.


        The Cookbook contains a recipe on Creating a User Using a

        Remote Authentication Provider

        (LDAP)

        which demonstrates this workflow using the Posit SDKs.


        #### LDAP and OAuth2 with Google Authentication


        - The created user role will default to the role specified by

        the config setting `Authorization.DefaultUserRole`.'
      operationId: createPullUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreatePullInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The request could not be completed due to a conflict.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Create a user using details from a remote authentication provider (LDAP, OAuth2…
      tags:
      - Users
  /v1/users/remote:
    get:
      description: 'This endpoint is used to support operations against users who

        do not have a Posit Connect account, such as

        creating LDAP and OAuth2 with Google users.

        See GET /v1/users for listing users.


        This endpoint searches for users on Posit Connect and on

        your LDAP or OAuth2 with Google system.


        Results are first sorted based on similarity to the `prefix`

        and then by first name, last name, username, and email.


        - This endpoint can be used only by LDAP or OAuth2 with Google

        authentication and will return an error otherwise.

        - Publisher or administrator access is required to access this

        endpoint.

        - The `email` field is not populated for non-admins when

        `Server.HideEmailAddresses` is enabled.

        - The `external_id` field is only visible to administrators and to users

        viewing their own record.

        - When the user making the request is a viewer and

        `Authorization.ViewersCanOnlySeeThemselves` is being used,

        the results contain only the given user.'
      operationId: searchRemoteUsers
      parameters:
      - in: query
        name: prefix
        schema:
          type: string
      - in: query
        name: limit
        schema:
          default: 20
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteSearchResults'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Search for user details from a remote provider
      tags:
      - Users
  /v1/users/{guid}:
    get:
      description: 'Get detailed information on a specific user.


        The `email` field is not populated for non-admins when

        `Server.HideEmailAddresses` is enabled. The `external_id` field is only

        visible to administrators and to users viewing their own record.'
      operationId: getUser
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get user details
      tags:
      - Users
    put:
      description: 'This endpoint updates a given user and returns the updated

        user properties. Note that it returns only the properties that

        can be modified by this endpoint.


        If the authentication provider allows it:


        - a user can change their own user properties.

        - another user''s properties can be changed with administrator

        access.

        - The configuration setting `Authorization.UserInfoEditableBy`

        controls whether or not non-admins can edit their own properties.


        ### Password Authentication


        - Emails are required.

        - Changing an unconfirmed user''s email will cause the

        confirmation email to be resent to the new email.'
      operationId: updateUser
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableUser'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The request could not be completed due to a conflict.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Update a user
      tags:
      - Users
  /v1/users/{guid}/lock:
    post:
      description: 'This endpoint locks or unlocks a given user account.


        - Unlocking a user is prohibited if that additional user would

        violate the user account limit specified by the Posit Connect product

        license.

        - Administrator access is required to access this endpoint.

        - Users are able to lock themselves.'
      operationId: lockUser
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockUserInput'
        required: true
      responses:
        '200':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Lock a user
      tags:
      - Users
components:
  schemas:
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    RemoteSearchResults:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            description: The users list
            items:
              $ref: '#/components/schemas/UserWithTicket'
            type: array
        type: object
      description: The remote user search results with paging information.
    OffsetPaging:
      description: Offset-based pagination metadata.
      properties:
        current_page:
          description: The current page of results
          example: 1
          format: int32
          type: integer
        total:
          description: The number of items that match the given filters
          example: 1
          format: int32
          type: integer
      type: object
    UserWithTicket:
      additionalProperties: false
      description: A user object with a temporary ticket for remote user creation.
      properties:
        email:
          description: The user's email.
          example: jon.doe@example.com
          type: string
        username:
          description: The user's username.
          example: jondoe
          type: string
        first_name:
          description: The user's first name.
          example: Jon
          type: string
        last_name:
          description: The user's last name.
          example: Doe
          type: string
        user_role:
          description: The user's role.
          enum:
          - administrator
          - publisher
          - viewer
          example: administrator
          type: string
        created_time:
          description: 'The timestamp (RFC3339) indicating when the user was created in

            the Posit Connect server.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        updated_time:
          description: 'The timestamp (RFC3339) indicating when information about this

            user was last updated in the Posit Connect server.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        active_time:
          description: 'The timestamp (RFC3339) indicating approximately when the user

            was last active. Highly active users only receive periodic updates.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type:
          - string
          - 'null'
        confirmed:
          description: 'When `false`, the created user must confirm their account through

            an email. This feature is unique to password authentication.'
          example: true
          type: boolean
        locked:
          description: Whether or not the user is locked.
          example: false
          type: boolean
        external_id:
          description: 'The unique identifier for this user from the authentication

            provider, when available.'
          example: okta-12345-abcde
          type: string
        guid:
          description: 'The user''s GUID, or unique identifier in

            [RFC4122](https://www.rfc-editor.org/rfc/rfc4122)

            format. When a user does not exist in the Posit Connect server, this

            property

            will be `null`.'
          example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
          format: uuid
          type:
          - string
          - 'null'
        temp_ticket:
          description: 'This value is for actions that require a `temp_ticket`, such

            as adding an LDAP or OAuth2 with Google user to the Connect server.'
          type: string
      type: object
    LockUserInput:
      additionalProperties: false
      description: The fields that must be specified when locking or unlocking a user.
      properties:
        locked:
          description: Whether or not the user should be locked.
          example: true
          type:
          - boolean
          - 'null'
      type: object
    EditableUser:
      additionalProperties: false
      description: The editable user properties.
      properties:
        email:
          description: The user's email
          example: jon.doe@example.com
          type: string
        username:
          description: The user's username
          example: jondoe
          type: string
        first_name:
          description: The user's first name
          example: Jon
          type: string
        last_name:
          description: The user's last name
          example: Doe
          type: string
        user_role:
          description: The user's role
          example: administrator
          type: string
        updated_time:
          description: 'The timestamp (in [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339) format)

            when the

            user was last updated in the Posit Connect server'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
      type: object
    UserUpdateInput:
      additionalProperties: false
      description: The fields that can be specified when updating a user.
      properties:
        email:
          description: The user's email.
          example: jon.doe@example.com
          type: string
        username:
          description: The user's username.
          example: jondoe
          type: string
        first_name:
          description: The user's first name.
          example: Jon
          type: string
        last_name:
          description: The user's last name.
          example: Doe
          type: string
        user_role:
          description: The user's role.
          enum:
          - administrator
          - publisher
          - viewer
          example: administrator
          type: string
      type: object
    UserCreatePushInput:
      additionalProperties: false
      description: The fields that can be specified when creating a user from caller-supplied details.
      properties:
        username:
          description: The user's desired username.
          example: jondoe
          type: string
        first_name:
          description: The user's first name.
          example: Jon
          type: string
        last_name:
          description: The user's last name.
          example: Doe
          type: string
        email:
          description: The user's email address.
          example: jon.doe@example.com
          type: string
        user_role:
          description: 'The user''s role. When `null`, the role is determined by the server

            default.'
          enum:
          - administrator
          - publisher
          - viewer
          example: publisher
          type:
          - string
          - 'null'
        user_must_set_password:
          description: 'When `true`, the created user will be asked to set the password

            on first login.'
          example: false
          type: boolean
        password:
          description: 'The user''s initial password. Must meet minimum password

            requirements.'
          type: string
        external_id:
          description: 'The unique identifier for this user from the authentication

            provider.'
          example: okta-12345-abcde
          type: string
        unique_id:
          description: 'Deprecated: use `external_id` instead.'
          example: okta-12345-abcde
          type: string
      type: object
    Users:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            description: The users list
            items:
              $ref: '#/components/schemas/User'
            type: array
        type: object
      description: The users list with paging information.
    User:
      description: A user object.
      properties:
        email:
          description: The user's email.
          example: jon.doe@example.com
          type: string
        username:
          description: The user's username.
          example: jondoe
          type: string
        first_name:
          description: The user's first name.
          example: Jon
          type: string
        last_name:
          description: The user's last name.
          example: Doe
          type: string
        user_role:
          description: The user's role.
          enum:
          - administrator
          - publisher
          - viewer
          example: administrator
          type: string
        created_time:
          description: 'The timestamp (RFC3339) indicating when the user was created in

            the Posit Connect server.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        updated_time:
          description: 'The timestamp (RFC3339) indicating when information about this

            user was last updated in the Posit Connect server.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        active_time:
          description: 'The timestamp (RFC3339) indicating approximately when the user

            was last active. Highly active users only receive periodic updates.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type:
          - string
          - 'null'
        confirmed:
          description: 'When `false`, the created user must confirm their account through

            an email. This feature is unique to password authentication.'
          example: true
          type: boolean
        locked:
          description: Whether or not the user is locked.
          example: false
          type: boolean
        external_id:
          description: 'The unique identifier for this user from the authentication

            provider, when available.'
          example: okta-12345-abcde
          type: string
        guid:
          description: 'The user''s GUID, or unique identifier, in UUID

            [RFC4122](https://www.rfc-editor.org/rfc/rfc4122)

            format'
          example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
          format: uuid
          type: string
      type: object
    UserCreatePullInput:
      additionalProperties: false
      description: The fields that must be specified when creating a user from a remote authentication provider.
      properties:

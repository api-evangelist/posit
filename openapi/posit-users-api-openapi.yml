          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        updated_time:
          description: 'The timestamp (RFC3339) indicating when information about this

            user was last updated in the Posit Connect server.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        active_time:
          description: 'The timestamp (RFC3339) indicating approximately when the user


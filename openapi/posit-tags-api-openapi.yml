openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference Tags API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: Tags
paths:
  /v1/content/{guid}/tags:
    get:
      description: 'List of all tags for the specified content item.


        Authenticated access required from an admin or from a user with at least viewer

        permissions on the content item.'
      operationId: listContentTags
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Tag'
                type: array
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List tags for content
      tags:
      - Tags
    post:
      description: 'Add the specified tag to an individual content item. When adding a tag,

        all tags above the specified tag in the tag tree are also added to the

        content item.


        Authenticated access required from an admin or from a user with

        collaborator/editor permissions on the content item.'
      operationId: addTag
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentTagInput'
        required: true
      responses:
        '200':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Add tag to content
      tags:
      - Tags
  /v1/content/{guid}/tags/{id}:
    delete:
      description: 'Remove the specified tag from an individual content item. When removing

        a tag, all children and descendant tags are also removed from the content

        item.


        Authenticated access required from an admin or from a user with

        collaborator/editor permissions on the content item.'
      operationId: removeTag
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Remove tag from content
      tags:
      - Tags
  /v1/tags:
    get:
      description: 'List of all tags.


        Authenticated access from a user is required.'
      operationId: listTags
      parameters:
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: parent_id
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Tag'
                type: array
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List tags
      tags:
      - Tags
    post:
      description: 'Create a new tag. Tags without a parent are considered tag "categories"

        and are used to organize other tags. Note that tag categories cannot be

        added to content items.


        Authenticated access from a user having an "administrator" role is required.'
      operationId: createTag
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Create tag
      tags:
      - Tags
  /v1/tags/{id}:
    delete:
      description: 'Deletes a tag, including all descendants in its own tag hierarchy.


        Authenticated access from a user having an "administrator" role is required.'
      operationId: deleteTag
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Delete tag
      tags:
      - Tags
    get:
      description: 'Get an individual tag by its identifier or by a comma-delimited "path"

        to the tag. The path to the tag is the series of tag names to traverse

        the tag hierarchy, starting with a tag category.


        Authenticated access from a user is required.'
      operationId: getTag
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get tag
      tags:
      - Tags
    patch:
      description: 'Update an existing tag.


        Authenticated access from a user having an "administrator" role is required.'
      operationId: updateTag
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Update tag
      tags:
      - Tags
  /v1/tags/{id}/content:
    get:
      description: 'List all of the content for the specified tag.


        Authenticated access from a user is required. If an "administrator"

        role is used, then all content items will be returned regardless of

        the visibility to the requesting user.'
      operationId: listTagContent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Content'
                type: array
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List content for tags
      tags:
      - Tags
components:
  schemas:
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    ContentSchedule:
      allOf:
      - $ref: '#/components/schemas/Schedule'
      - properties:
          variant:
            allOf:
            - $ref: '#/components/schemas/ScheduleVariant'
        type: object
      description: Schedule information with variant details for a content item.
    RRuleSet:
      additionalProperties: false
      description: RFC 5545 recurrence rule components for a schedule.
      properties:
        dtstart:
          description: 'The DTSTART component specifying when the schedule begins,

            including timezone information.'
          example: DTSTART;TZID=America/New_York:20240115T090000
          type: string
        rrules:
          description: An array of RRULE components defining the recurrence pattern.
          example:
          - RRULE:FREQ=DAILY;INTERVAL=2
          items:
            type: string
          type: array
        until:
          description: The UNTIL component specifying when the schedule ends, if applicable.
          example: UNTIL=20240215T090000Z
          type: string
      type: object
    Schedule:
      description: Base schedule information for a content item.
      properties:
        type:
          description: The schedule type.
          example: rrule
          type: string
        schedule:
          allOf:
          - $ref: '#/components/schemas/RRuleSet'
          description: The recurrence rule in RFC5545 format.
        next_run:
          description: The next scheduled run time. Null if no future runs are scheduled.
          format: date-time
          type:
          - string
          - 'null'
        email:
          description: Whether email notifications are enabled for this schedule.
          example: false
          type: boolean
        timezone:
          description: The timezone for this schedule.
          example: America/New_York
          type: string
        start_time:
          description: The start time of the schedule window.
          format: date-time
          type:
          - string
          - 'null'
        end_time:
          description: The end time of the schedule window. Null if the schedule runs indefinitely.
          format: date-time
          type:
          - string
          - 'null'
        last_run:
          allOf:
          - $ref: '#/components/schemas/ScheduleLastRun'
          description: Information about the last scheduled run.
      type: object
    ContentTagInput:
      additionalProperties: false
      description: The fields that must be specified when adding a tag to a content item.
      properties:
        tag_id:
          description: The unique identifier for the tag.
          example: '101'
          type: string
      type: object
    TagInput:
      additionalProperties: false
      description: The fields that can be specified when creating or updating a tag.
      properties:
        name:
          description: 'The name of the tag. Tags under the same parent must have a unique

            name and cannot be longer than 255 characters.'
          example: financial-statements
          type:
          - string
          - 'null'
        parent_id:
          description: 'The identifier for the parent tag. If there is no parent_id,

            the tag will be a top-level tag.'
          example: '101'
          type:
          - string
          - 'null'
      type: object
    Tag:
      additionalProperties: false
      description: A tag used to organize content within Connect.
      properties:
        id:
          description: The identifier for the tag.
          example: '101'
          type: string
        name:
          description: The name of the tag.
          example: financial-statements
          type: string
        parent_id:
          description: 'The identifier for the parent tag. If there is no parent_id,

            the tag is a top-level tag.'
          example: '102'
          type:
          - string
          - 'null'
        created_time:
          description: The timestamp (RFC3339) indicating when the tag was created.
          example: '2006-01-02T15:04:05Z'
          format: date-time
          type: string
        updated_time:
          description: The timestamp (RFC3339) indicating when the tag was updated.
          example: '2006-01-02T15:04:05Z'
          format: date-time
          type: string
      type: object
    Content:
      additionalProperties: false
      description: The content object models all the "things" you may deploy to Posit Connect. This includes Shiny applications, R Markdown documents, Jupyter notebooks, Plumber APIs, FastAPI and Flask APIs, Python apps, plots, and pins.
      properties:
        guid:
          description: The unique identifier of this content item.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        name:
          description: 'A simple identifier. Allows alpha-numeric

            characters, periods (`"."`), hyphens (`"-"`), and underscores (`"_"`).'
          example: quarterly-analysis
          type: string
        title:
          description: The title of this content.
          example: Quarterly Analysis of Team Velocity
          type:
          - string
          - 'null'
        description:
          description: A rich description of this content.
          example: This report calculates per-team statistics ...
          type: string
        access_type:
          description: 'Access type describes how this content manages its viewers. The

            value `all` is the most permissive; any visitor to Posit Connect

            will be able to view this content. The value `logged_in` indicates

            that all Posit Connect accounts may view the content. The `acl`

            value lets specifically enumerated users and groups view the

            content. Users configured as collaborators may always view content.


            Access types may be restricted by the Connect configuration or the

            product license.'
          example: acl
          type: string
        locked:
          description: Whether or not the content is locked.
          example: false
          type: boolean
        locked_message:
          description: 'A custom message that is displayed by the content item when locked.

            It is possible to format this message using Markdown.'
          example: '# This piece of content is locked'
          type: string
        connection_timeout:
          description: 'Maximum number of seconds allowed without data sent or received

            across a client connection. A value of `0` means connections will

            never time-out (not recommended). When `null`, the default

            [`Scheduler.ConnectionTimeout`](../admin/appendix/configuration/index.md#Scheduler.ConnectionTimeout) is used. Applies only to content types

            that are executed on demand.'
          example: 3600
          format: int32
          type:
          - integer
          - 'null'
        read_timeout:
          description: 'Maximum number of seconds allowed without data received from a

            client connection. A value of `0` means a lack of client (browser)

            interaction never causes the connection to close. When `null`, the

            default [`Scheduler.ReadTimeout`](../admin/appendix/configuration/index.md#Scheduler.ReadTimeout) is used. Applies only to content

            types that are executed on demand.'
          example: 3600
          format: int32
          type:
          - integer
          - 'null'
        init_timeout:
          description: 'The maximum number of seconds allowed for an interactive application

            to start. Posit Connect must be able to connect to a newly

            launched application before this threshold has

            elapsed. When `null`, the default [`Scheduler.InitTimeout`](../admin/appendix/configuration/index.md#Scheduler.InitTimeout) is used.

            Applies only to content types that are executed on demand.'
          example: 60
          format: int32
          type:
          - integer
          - 'null'
        idle_timeout:
          description: 'The maximum number of seconds a worker process for an interactive

            application to remain alive after it goes idle (no active

            connections). When `null`, the default [`Scheduler.IdleTimeout`](../admin/appendix/configuration/index.md#Scheduler.IdleTimeout) is

            used. Applies only to content types that are executed on demand.'
          example: 5
          format: int32
          type:
          - integer
          - 'null'
        max_processes:
          description: 'Specifies the total number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default [`Scheduler.MaxProcesses`](../admin/appendix/configuration/index.md#Scheduler.MaxProcesses) is used. Applies only to

            content types that are executed on demand.'
          example: 3
          format: int32
          type:
          - integer
          - 'null'
        min_processes:
          description: 'Specifies the minimum number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default `Scheduler.MinProcesses` is used. Applies only to

            content types that are executed on demand.'
          example: 0
          format: int32
          type:
          - integer
          - 'null'
        max_conns_per_process:
          description: 'Specifies the maximum number of client connections allowed to an

            individual process. Incoming connections which will exceed this

            limit are routed to a new process or rejected. When `null`, the

            default [`Scheduler.MaxConnsPerProcess`](../admin/appendix/configuration/index.md#Scheduler.MaxConnsPerProcess) is used. Applies only to

            content types that are executed on demand.'
          example: 20
          format: int32
          type:
          - integer
          - 'null'
        load_factor:
          description: 'Controls how aggressively new processes are spawned. When `null`,

            the default [`Scheduler.LoadFactor`](../admin/appendix/configuration/index.md#Scheduler.LoadFactor) is used. Applies only to content

            types that are executed on demand.'
          example: 0.5
          format: double
          type:
          - number
          - 'null'
        memory_request:
          description: 'The minimum amount of RAM this content needs when executing or

            rendering, expressed in bytes. This is used when running in an

            off-host execution configuration to determine where the content

            should be run. When `null`, the default [`Scheduler.MemoryRequest`](../admin/appendix/configuration/index.md#Scheduler.MemoryRequest) is

            used.'
          example: 1073741824
          format: int64
          type:
          - integer
          - 'null'
        memory_limit:
          description: 'The maximum amount of RAM this content will be allowed to consume

            when executing or rendering, expressed in bytes. If the process tries

            to use more memory than allowed, it will be terminated. When `null`,

            the default [`Scheduler.MemoryLimit`](../admin/appendix/configuration/index.md#Scheduler.MemoryLimit) is used.'
          example: 2147483648
          format: int64
          type:
          - integer
          - 'null'
        cpu_request:
          description: 'The minimum amount of compute power this content needs when executing

            or rendering, expressed in ["CPU

            Units"](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#meaning-of-cpu),

            where 1.0 unit is equivalent to 1 physical or virtual core.

            Fractional values are allowed. This is used when running in an

            off-host execution configuration to determine where the content

            should be run. When `null`, the default [`Scheduler.CPURequest`](../admin/appendix/configuration/index.md#Scheduler.CPURequest) is

            used.'
          example: 1
          format: double
          type:
          - number
          - 'null'
        cpu_limit:
          description: 'The maximum amount of compute power this content will be allowed to

            consume when executing or rendering, expressed in ["CPU

            Units"](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#meaning-of-cpu),

            where 1.0 unit is equivalent to 1 physical or virtual core.

            Fractional values are allowed. This is used when running in an

            off-host execution configuration. If the process tries to use more

            CPU than allowed, it will be throttled. When `null`, the default

            [`Scheduler.CPULimit`](../admin/appendix/configuration/index.md#Scheduler.CPULimit) is used.'
          example: 1.5
          format: double
          type:
          - number
          - 'null'
        amd_gpu_limit:
          description: 'The number of AMD GPUs that will be

            [allocated by

            Kubernetes](https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/)

            to run this content. This is used when running in an

            off-host execution configuration. When `null`, the default

            [`Scheduler.AMDGPULimit`](../admin/appendix/configuration/index.md#Scheduler.AMDGPULimit) is used. This setting can not exceed

            [`Scheduler.MaxAMDGPULimit`](../admin/appendix/configuration/index.md#Scheduler.MaxAMDGPULimit).'
          example: 1
          format: int64
          type:
          - integer
          - 'null'
        nvidia_gpu_limit:
          description: 'The number of NVIDIA GPUs that will be

            [allocated by

            Kubernetes](https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/)

            to run this content. This is used when running in an

            off-host execution configuration. When `null`, the default

            [`Scheduler.NvidiaGPULimit`](../admin/appendix/configuration/index.md#Scheduler.NvidiaGPULimit) is used. This setting can not exceed

            [`Scheduler.MaxNvidiaGPULimit`](../admin/appendix/configuration/index.md#Scheduler.MaxNvidiaGPULimit).'
          example: 1
          format: int64
          type:
          - integer
          - 'null'
        service_account_name:
          description: 'The name of the Kubernetes service account that is used to run a particular

            piece of content.

            It must adhere to valid Kubernetes service account naming rules.


            Connect must be configured to run with [`Launcher.Enabled = true`](../admin/appendix/configuration/index.md#Launcher.Enabled),

            [`Launcher.Kubernetes = true`](../admin/appendix/configuration/index.md#Launcher.Kubernetes) and

            [`Launcher.KubernetesContentServiceAccountSelection = true`](../admin/appendix/configuration/index.md#Launcher.KubernetesContentServiceAccountSelection)

            for this value to be applied. It will have precedence over the

            [`Launcher.KubernetesDefaultServiceAccount`](../admin/appendix/configuration/index.md#Launcher.KubernetesDefaultServiceAccount) that may be set in the

            configuration for Connect.


            If this value is defined and Connect is configured with

            [`Launcher.KubernetesContentServiceAccountSelection = false`](../admin/appendix/configuration/index.md#Launcher.KubernetesContentServiceAccountSelection) an error will be

            returned.


            Only administrators and publishers can view this value.

            Only administrators can set or change this value.'
          example: rstudio-connect-content
          type:
          - string
          - 'null'
        default_image_name:
          description: 'The default image that will be used when none is defined by the

            bundle''s manifest. A specific image may be selected by setting the

            `environment.image` field in the manifest. If no image is selected

            by the manifest file, then the `default_image_name` is used.

            If a target image is not defined by the manifest, and no

            `default_image_name` is configured, then Connect will select an

            image from the list of configured execution environments.


            If either `environment.identifier` or `environment.image` is specified in

            the bundle''s

            manifest.json then the settings in the manifest are used and the

            content-level default

            settings will be ignored. This allows historical bundle activation to behave

            consistently

            even when the content-level default values may have changed.


            A `null` value is returned when the client does not have sufficient

            rights to see this information.


            Use the `/v1/environments` API endpoints to determine which environments

            are available for content execution.'
          example: rstudio/content-base:r4.1.3-py3.10.11-jammy
          type:
          - string
          - 'null'
        default_environment_guid:
          description: 'The default execution environment that will be used when none is defined by

            the

            bundle''s manifest. A specific execution environment may be selected by

            setting the

            `environment.identifier` field in the manifest. If no execution environment

            is selected

            by the manifest file, then `default_environment_guid` is used to select the

            execution environment. If a target execution environment is not defined by

            the manifest,

            and no `default_environment_guid` is configured, then Connect will select an

            execution environment from the list of configured execution environments.


            If either `environment.identifier` or `environment.image` is specified in

            the bundle''s

            manifest.json then the settings in the manifest are used and the

            content-level default

            settings will be ignored. This allows historical bundle activation to behave

            consistently

            even when the content-level default values may have changed.


            A `null` value is returned when the client does not have sufficient

            rights to see this information.


            Use the `/v1/environments` API endpoints to determine which environments

            are available for content execution.'
          example: 36538b83-ea6d-4839-ae8e-53c52ac5f0bf
          format: uuid
          type:
          - string
          - 'null'
        created_time:
          description: The timestamp (RFC3339) indicating when this content was created.
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        last_deployed_time:
          description: 'The timestamp (RFC3339) indicating when this content last had a

            successful bundle deployment performed.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        bundle_id:
          description: 'The identifier for the active deployment bundle. Automatically

            assigned upon the successful deployment of that bundle.'
          example: '101'
          type:
          - string
          - 'null'
        app_mode:
          description: 'The runtime model for this content. Has a value of `unknown` before

            data is deployed to this item. Automatically assigned upon the first

            successful bundle deployment.


            Valid values are:


            * `api` - R code defining a [Plumber API](https://www.rplumber.io/).

            * `jupyter-static` - A [Jupyter

            Notebook](https://jupyter-notebook.readthedocs.io/en/stable/).

            * `jupyter-voila` A [Voila](https://voila.readthedocs.io/en/stable/)

            interactive dashboard.

            * `python-api` - Python code defining a WSGI API (such as

            [Flask](https://palletsprojects.com/p/flask/))

            * `python-bokeh` - Python code defining a [Bokeh

            application](https://bokeh.org/).

            * `python-panel` - Python code defining a [Panel

            application](https://panel.holoviz.org/).

            * `python-dash` - Python code defining a [Dash

            application](https://dash.plotly.com/).

            * `python-fastapi` - Python code defining an ASGI API (such as

            [FastAPI](https://fastapi.tiangolo.com/))

            * `python-gradio` - Python code defining a [Gradio](https://www.gradio.app/)

            application.

            * `python-shiny` - Python code defining a [Shiny

            application](https://shiny.posit.co/py/).

            * `python-streamlit` - Python code defining a [Streamlit

            application](https://streamlit.io/).

            * `quarto-shiny` - A [Quarto](https://quarto.org/) document with a Shiny

            runtime.

            * `quarto-static` - A [Quarto](https://quarto.org/) document or site.

            * `rmd-shiny` - An [R Markdown](https://rmarkdown.rstudio.com/) document

            with a Shiny runtime.

            * `rmd-static` - An [R Markdown](https://rmarkdown.rstudio.com/) document or

            site.

            * `shiny` - R code defining a [Shiny application](https://shiny.posit.co/).

            * `static` - Content deployed without source; often HTML and plots.

            * `tensorflow-saved-model` - A TensorFlow Model API.

            * `unknown` - No known runtime model.'
          example: shiny
          type: string
        content_category:
          description: 'Describes the specialization of the content runtime model.

            Automatically assigned upon the first successful bundle deployment.


            The `content_category` field refines the type of content specified by

            `app_mode`. It is empty by default. The rsconnect R package may assign

            a value when analyzing your content and building its manifest and

            bundle. Plots (images created in the RStudio IDE and presented in the

            "Plots" pane) have an `app_mode` of `static` and receive a

            `content_category` of `plot` to distinguish them from other HTML

            documents. Pinned static data sets have an `app_mode` of `static` and a

            `content_category` of `pin`. Multi-document R Markdown sites have an

            `app_mode` of `rmd-static` and a `content_category` of `site`.

            API content types (such as FastAPI, Flask, or Plumber) that serve as

            MCP servers have a `content_category` of `mcp`. The `mcp` category is

            auto-detected on first deploy but can also be set or cleared via

            [PATCH /v1/content/{guid}](#updateContent).'
          example: site
          type: string
        parameterized:
          description: 'True when R Markdown rendered content allows parameter

            configuration. Automatically assigned upon the first successful

            bundle deployment. Applies only to content with an `app_mode` of

            `rmd-static`.'
          example: false
          type: boolean
        environment_guid:
          description: 'The guid of the execution environment used to run this content. Content

            running locally

            on the same server as Connect will have either a `null` value.


            A `null` value is returned when the client does not have sufficient rights

            to see this

            information.'
          example: 36538b83-ea6d-4839-ae8e-53c52ac5f0bf
          format: uuid
          type:
          - string
          - 'null'
        cluster_name:
          description: 'The location where this content runs. Content running on the same

            server as Connect will have either a `null` value or the string

            "Local". Gives the name of the cluster when run external to the

            Connect host.


            A `null` value is returned when the client does not have sufficient

            rights to see this information.'
          example: Local
          type:
          - string
          - 'null'
        image_name:
          description: 'The name of the container image used to run this content in containerized

            environments such as Kubernetes. Content running locally

            on the same server as Connect will have either a `null` value or the string

            "Local".


            A `null` value is returned when the client does not have sufficient

            rights to see this information.'
          example: rstudio/content-base:r4.1.3-py3.10.11-jammy
          type:
          - string
          - 'null'
        r_version:
          description: 'The of R interpreter associated with this content. A `null` value

            represents that R is not used by this content, that the content has

            not been prepared for execution, or that the client does not have

            sufficient rights to see this information. Automatically assigned

            upon the successful deployment of a bundle.'
          example: 3.5.1
          type:
          - string
          - 'null'
        py_version:
          description: 'The version of Python associated with this content. A `null` value

            represents that Python is not used by this content, that the content

            has not been prepared for execution, or that the client does not

            have sufficient rights to see this information. Automatically

            assigned upon the successful deployment of a bundle.'
          example: 3.8.2
          type:
          - string
          - 'null'
        quarto_version:
          description: 'The version of Quarto associated with this content. A `null`

            represents that Quarto is not used by this content, that the content

            has not been prepared for execution, or that the client does not

            have sufficient rights to see this information. Automatically

            assigned upon the successful deployment of a bundle.'
          example: 0.2.22
          type:
          - string
          - 'null'
        node_version:
          description: 'The version of Node.js associated with this content. A `null`

            represents that Node.js is not used by this content, that the content

            has not been prepared for execution, or that the client does not

            have sufficient rights to see this information. Automatically

            assigned upon the successful deployment of a bundle.'
          example: 22.11.0
          type:
          - string
          - 'null'
        r_environment_management:
          description: 'Indicates whether or not Connect is managing an R environment and

            has installed the required packages for this content. A `null` value

            represents that R is not used by this content, that the content has

            not been prepared for execution, or that the client does not have

            sufficient rights to see this information. Automatically assigned

            upon the successful deployment of a bundle.'
          example: true
          type:
          - boolean
          - 'null'
        default_r_environment_management:
          description: 'Indicates whether or not Connect should create and manage an R

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.


            A `null` value is also returned when the client does not have

            sufficient rights to see this information.


            This value is ignored if the server setting

            [`Applications.DefaultEnvironmentManagementSelection`](../admin/appendix/configuration/index.md#Applications.DefaultEnvironmentManagementSelection) is disabled.'
          example: true
          type:
          - boolean
          - 'null'
        py_environment_management:
          description: 'Indicates whether or not Connect is managing a Python environment

            and has installed the required packages for this content. A `null`

            value represents that Python is not used by this content, that the

            content has not been prepared for execution, or that the client does

            not have sufficient rights to see this information. Automatically

            assigned upon the successful deployment of a bundle.'
          example: true
          type:
          - boolean
          - 'null'
        default_py_environment_management:
          description: 'Indicates whether or not Connect should create and manage a Python

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.


            A `null` value is also returned when the client does not have

            sufficient rights to see this information.


            This value is ignored if the server setting

            [`Applications.DefaultEnvironmentManagementSelection`](../admin/appendix/configuration/index.md#Applications.DefaultEnvironmentManagementSelection) is disabled.'
          example: true
          type:
          - boolean
          - 'null'
        run_as:
          description: 'The UNIX user that executes this content. When `null`, the default

            [`Applications.RunAs`](../admin/appendix/configuration/index.md#Applications.RunAs) is used. Applies only to executable content

            types - not `static`.


            Only administrators can change this value.


            If [`Applications.RunAsEnabled = false`](../admin/appendix/configuration/index.md#Applications.RunAsEnabled), this value will be ignored when

            executing content.'
          example: rstudio-connect
          type:
          - string
          - 'null'
        run_as_current_user:
          description: 'Indicates that Connect should run processes for this content item

            under the Unix account of the user who visits it. Content accessed

            anonymously will continue to run as the specified `run_as` user.


            Connect must be configured with the server setting

            [`Applications.RunAsCurrentUser = true`](../admin/appendix/configuration/index.md#Applications.RunAsCurrentUser). Current user execution is

            supported with the PAM, OAuth2, SAML, and LDAP authentication

            providers; PAM additionally requires [`PAM.ForwardPassword = true`](../admin/appendix/configuration/index.md#PAM.ForwardPassword).


            This setting applies to application content types (Shiny, Dash,

            Streamlit, Bokeh, and Panel) and API content types (Plumber, Flask,

            FastAPI, and Node.js).


            Only administrators can change this value.'
          example: false
          type: boolean
        metrics_collection_enabled:
          description: 'Controls whether per-job resource metrics (CPU, memory, connections)

            are collected for this content item.


            When `null`, the content item inherits the server-wide default from

            [`Applications.MetricsCollectionEnabled`](../admin/appendix/configuration/index.md#Applications.MetricsCollectionEnabled). Explicit `true` or `false`

            values override the server default.


            Metrics can be retrieved via the

            [GET /v1/content/{guid}/jobs/{key}/metrics](#getJobMetrics) endpoint.'
          example: true
          type:
          - boolean
          - 'null'
        notify_on_share:
          description: 'Controls whether email notifications are sent by default

            when users or groups are added as collaborators or viewers.


            When `null`, the content item inherits the server-wide default

            from [`Applications.NotifyOnShare`](../admin/appendix/configuration/index.md#Applications.NotifyOnShare). Explicit `true` or `false`

            values override the server default.'
          example: true
          type:
          - boolean
          - 'null'
        otel_enabled:
          description: 'Controls whether content telemetry (metrics, logs, traces) is collected

            for this content item. Both this field and the server setting

            `OpenTelemetry.AllowContentInstrumentation` must be true for signals to flow.

            Only visible to collaborators and owners.'
          example: false
          type: boolean
        owner_guid:
          description: 'The unique identifier of the user who created this content item.

            Automatically assigned when the content is created.'
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        content_url:
          description: 'The URL associated with this content. Computed from the associated

            GUID for this content.'
          example: https://posit-connect.company.com/content/9d8e7f3e-92e8-4a08-b0ff-196319cc56ae
          type: string
        dashboard_url:
          description: 'The URL within the Connect dashboard where this content can be configured.

            Computed from the GUID for this content.'
          example: https://posit-connect.company.com/connect/#/apps/9d8e7f3e-92e8-4a08-b0ff-196319cc56ae
          type: string
        vanity_url:
          description: 'The vanity URL associated with this content item. Included in responses

            when the vanity URL is set and `include=vanity_url` is provided.'
          example: https://posit-connect.company.com/my-content/
          type: string
        app_role:
          description: 'The relationship of the accessing user to this content. A value of

            `owner` is returned for the content owner. `editor` indicates a

            collaborator. The `viewer` value is given to users who are permitted

            to view the content. A `none` role is returned for administrators

            who cannot view the content but are permitted to view its

            configuration. Computed at the time of the request.'
          example: owner
          type: string
        bookmarked:
          description: 'Indicates whether the requesting user has bookmarked this content

            item. Included in responses when `include=bookmarked` is provided.'
          example: true
          type:
          - boolean
          - 'null'
        schedules:
          description: 'Schedules associated with this content item. Included in responses when

            `include=schedule` is provided.'
          items:
            $ref: '#/components/schemas/ContentSchedule'
          type:
          - array
          - 'null'
        id:
          description: The internal numeric identifier of this content item.
          example: '314'
          type: string
        tags:
          description: 'Tags associated with this content item. Included in responses when

            `include=tags` is provided. Returns an empty array when content has

            no tags.'
          items:
            $ref: '#/components/schemas/Tag'
          type:
          - array
          - 'null'
        owner:
          allOf:
          - $ref: '#/components/schemas/ContentOwner'
          description: 'Basic details about the owner of this content item. Included in

            responses when `include=owner` is provided.'
        public_content_status:
          description: 'Validation status of public interactive content. When validation is

            required by licensing, this will be one of "ok", "warning", or

            "restricted". If licensing does not require validation, it will be

            "unrestricted"; if licensing does not allow public interactive

            content, it will be "unlicensed". If the app has not been made public,

            but public content is permitted, it will be "none".'
          example: unrestricted
          type:
          - string
          - 'null'
      type: object
    ScheduleVariant:
      additionalProperties: false
      description: Variant information embedded in a schedule.
      properties:
        key:
          description: The variant key.
          example: default
          type: string
        name:
          description: The variant name.
          example: Default Variant
          type: string
        is_default:
          description: Whether this is the default variant.
          example: true
          type: boolean
      type: object
    ScheduleLastRun:
      additionalProperties: false
      description: Information about the last scheduled run.
      properties:
        job_key:
          description: The unique key of the job.
          example: abc123xyz
          type: string
        status:
          description: The status of the last run.
          example: success
          type: string
        scheduled_time:
          description: The scheduled time of the run.
          format: date-time
          type:
          - string
          - 'null'
        queued_time:
          description: The time the run was queued.
          format: date-time
          type:
          - string
          - 'null'
        start_time:
          description: The time the run started.
          format: date-time
          type: string
        end_time:
          description: The time the run ended. Null if still running.
          format: date-time
          type:
          - string
          - 'null'
        run_duration_ms:
          description: The duration of the run in milliseconds. Null if still running.
          example: 5000
          format: int64
          type:
          - integer
          - 'null'
        exit_code:
          description: The exit code of the job. Null if still running.
          example: 0
          format: int64
          type:
          - integer
          - 'null'
      type: object
    ContentOwner:
      additionalProperties: false
      description: Basic details about the owner of a content item.
      properties:
        guid:
          description: The owner's unique identifier.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        username:
          description: The owner's username.
          example: jondoe
          type:
          - string
          - 'null'
        first_name:
          description: The owner's first name.
          example: Jon
          type:
          - string
          - 'null'
        last_name:
          description: The owner's last name.
          example: Doe
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

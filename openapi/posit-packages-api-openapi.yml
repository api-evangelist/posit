openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference Packages API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: Packages
paths:
  /v1/packages:
    get:
      description: 'Get the names and versions of all installed packages

        across all content items. Returned packages are sorted

        by language and then by package name.

        Content items with `r_environment_management` or

        `python_environment_management` set to `false` will not

        have their packages listed.

        This endpoint uses offset pagination. Requests can include

        query-string parameters for `page_number` and `page_size` to

        fetch different pages of results.'
      operationId: getPackages
      parameters:
      - description: The page number to return.
        in: query
        name: page_number
        schema:
          default: 1
          format: int32
          type: integer
      - description: The number of items per page.
        in: query
        name: page_size
        schema:
          default: 20
          format: int32
          type: integer
      - description: Whether results are in ascending order.
        in: query
        name: asc_order
        schema:
          default: true
          type: boolean
      - in: query
        name: name
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagesResponse'
          description: Successful response.
        '204':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get package dependencies for all content
      tags:
      - Packages
components:
  schemas:
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    PackagesResponse:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            description: The list of packages
            items:
              $ref: '#/components/schemas/Package'
            type: array
        type: object
      description: An object containing a paginated list of packages.
    OffsetPaging:
      description: Offset-based pagination metadata.
      properties:
        current_page:
          description: The current page of results
          example: 1
          format: int32
          type: integer
        total:
          description: The number of items that match the given filters
          example: 1
          format: int32
          type: integer
      type: object
    Package:
      additionalProperties: false
      description: A package dependency record.
      properties:
        language:
          description: Language ecosystem the package belongs to
          type: string
        language_version:
          description: Version of R or Python used by the content
          example: 3.12.4
          type: string
        name:
          description: Package name
          example: shiny
          type: string
        version:
          description: Package version
          example: 1.0.3
          type: string
        hash:
          description: Package description hash for R packages
          example: e4ac73dd20b2f6420742aac66e5d3e78
          type:
          - string
          - 'null'
        bundle_id:
          description: Identifier for the bundle that depends on this package
          example: '449'
          type: string
        app_id:
          description: This field is deprecated and has been renamed to `content_id`.
          example: '145'
          type: string
        app_guid:
          description: This field is deprecated and has been renamed to `content_guid`.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        content_id:
          description: Numeric identifier for the content that depends on this package
          example: '145'
          type: string
        content_guid:
          description: The unique identifier of the content item that depends on this package
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

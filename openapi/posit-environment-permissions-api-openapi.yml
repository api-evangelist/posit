openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference Environment Permissions API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: Environment Permissions
paths:
  /v1/environments/{guid}/permissions:
    get:
      description: 'List the users and groups that have access to this execution environment.

        You must have administrator privileges to perform this action.'
      operationId: listEnvironmentPermissions
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EnvironmentPermission'
                type: array
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List permissions
      tags:
      - Environment Permissions
    post:
      description: 'Grants a user or group access to this execution environment.

        You must have administrator privileges to perform this action.'
      operationId: addEnvironmentPermission
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentPermissionInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPermission'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Add permission
      tags:
      - Environment Permissions
  /v1/environments/{guid}/permissions/{permission_guid}:
    delete:
      description: 'Removes access to this execution environment from a user or group.

        You must have administrator privileges to perform this action.'
      operationId: deleteEnvironmentPermission
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: permission_guid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Delete permission
      tags:
      - Environment Permissions
    get:
      description: 'Get a single permission entry for the execution environment, given its GUID.

        You must have administrator privileges to perform this action.'
      operationId: getEnvironmentPermission
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: permission_guid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPermission'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get permission
      tags:
      - Environment Permissions
components:
  schemas:
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    EnvironmentPermissionInput:
      additionalProperties: false
      description: 'The fields that can be specified when adding permissions to an execution environment.

        Note that only one of user_guid or group_guid can be specified in a single request.'
      properties:
        user_guid:
          description: The identifier of the user. Do not specify this field if you are adding a group.
          example: 89a3c946-d73c-4781-8463-dd3cccff3fef
          format: uuid
          type:
          - string
          - 'null'
        group_guid:
          description: The identifier of the group. Do not specify this field if you are adding a user.
          example: 998f3356-96f0-48a2-9655-94334615fa5b
          format: uuid
          type:
          - string
          - 'null'
      type: object
    EnvironmentPermission:
      additionalProperties: false
      description: 'Provides details about the relationship between the execution

        environment and the user or group that has access to it.'
      properties:
        id:
          description: The internal identifier for this permission entry.
          example: '101'
          type: string
        guid:
          description: The identifier for this permission entry.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        environment_guid:
          description: The identifier of the execution environment.
          example: 62543474-5716-4423-92d1-b3a22163eb49
          format: uuid
          type: string
        user_guid:
          description: 'The identifier of the user listed in the permission entry.

            This field will be null if a group is listed.'
          example: d73f7343-02e8-4c52-9208-598e28f8002e
          format: uuid
          type:
          - string
          - 'null'
        group_guid:
          description: 'The identifier of the group listed in the permission entry.

            This field will be null if a user is listed.'
          example: a46be0c8-ef75-4dce-b902-d8e56a6b8509
          format: uuid
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

components:
  schemas:
    User:
      description: A user object.
      properties:
        email:
          description: The user's email.
          example: jon.doe@example.com
          type: string
        username:
          description: The user's username.
          example: jondoe
          type: string
        first_name:
          description: The user's first name.
          example: Jon
          type: string
        last_name:
          description: The user's last name.
          example: Doe
          type: string
        user_role:
          description: The user's role.
          enum:
          - administrator
          - publisher
          - viewer
          example: administrator
          type: string
        created_time:
          description: 'The timestamp (RFC3339) indicating when the user was created in

            the Posit Connect server.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        updated_time:
          description: 'The timestamp (RFC3339) indicating when information about this

            user was last updated in the Posit Connect server.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        active_time:
          description: 'The timestamp (RFC3339) indicating approximately when the user

            was last active. Highly active users only receive periodic updates.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          nullable: true
          type: string
        confirmed:
          description: 'When `false`, the created user must confirm their account through

            an email. This feature is unique to password authentication.'
          example: true
          type: boolean
        locked:
          description: Whether or not the user is locked.
          example: false
          type: boolean
        external_id:
          description: 'The unique identifier for this user from the authentication

            provider, when available.'
          example: okta-12345-abcde
          type: string
        guid:
          description: 'The user''s GUID, or unique identifier, in UUID

            [RFC4122](https://www.rfc-editor.org/rfc/rfc4122)

            format'
          example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
          format: uuid
          type: string
      type: object
    OffsetPaging:
      description: Offset-based pagination metadata.
      properties:
        current_page:
          description: The current page of results
          example: 1
          format: int32
          type: integer
        total:
          description: The number of items that match the given filters
          example: 1
          format: int32
          type: integer
      type: object
    Groups:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            description: The groups list
            items:
              $ref: '#/components/schemas/Group'
            type: array
        type: object
      description: The groups list with paging information.
    TrustedPublisher:
      description: 'A binding that allows a service principal (a machine identity such as a

        GitHub Actions workflow) to publish to a single content item. A workload

        that authenticates as the service principal can upload bundles and deploy

        this content, but cannot act on any other content.'
      properties:
        service_principal_guid:
          description: The GUID of the service principal bound to this content item.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        name:
          description: The descriptive name of the service principal.
          example: GitHub Actions (acme/web)
          type: string
        role:
          description: 'The auth role workloads authenticating as the service principal carry.

            Trusted publishers carry only the viewer role; their ability to publish

            comes from the per-content grant, not this role.'
          example: viewer
          type: string
        app_role:
          description: The content access level granted to the service principal on this item.
          example: editor
          type: string
      type: object
    GroupCreateInput:
      additionalProperties: false
      description: The fields that can be specified when creating a group.
      properties:
        name:
          description: The group's desired name
          example: marketing
          type: string
        unique_id:
          description: 'Applies to SAML, OAuth2 and Proxied authentication when

            the setting `GroupsByUniqueId` is enabled. This field

            must not be present otherwise.'
          type: string
        gid:
          description: 'The POSIX Group ID (GID) for

            [current user execution](../admin/process-management/index.md#runas-current).

            Only administrators can set this field, and only when using

            SAML or OAuth2 authentication. Must be a positive integer

            and unique across all groups.'
          example: 1001
          format: int64
          nullable: true
          type: integer
      type: object
    GroupUpdateInput:
      additionalProperties: false
      description: The fields that can be specified when updating a group.
      type: object
    GroupPatchInput:
      additionalProperties: false
      description: The fields that can be specified when partially updating a group.
      properties:
        name:
          description: 'The group''s new name. Cannot be empty or `null`, and must be

            at most 4096 characters. Names must be unique, except for

            SAML, OAuth2, and Proxied authentication when `GroupsByUniqueId`

            is enabled.'
          example: engineering
          nullable: true
          type: string
        owner_guid:
          description: 'The new owner''s unique identifier. Must reference an existing

            user who is not a viewer. Can be set to `null` to remove the

            owner for SAML, OAuth2, and Proxied authentication when

            `GroupsAutoProvision` is enabled.'
          example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
          format: uuid
          nullable: true
          type: string
        gid:
          description: 'The POSIX Group ID (GID) for

            [current user execution](../admin/process-management/index.md#runas-current).

            Must be a positive integer and unique across all groups. Set

            to `null` to remove the GID.'
          example: 1001
          format: int32
          nullable: true
          type: integer
      type: object
    GroupMember:
      allOf:
      - $ref: '#/components/schemas/User'
      description: A group member (user).
    GroupOwnershipContent:
      additionalProperties: false
      description: Content item with access control details for a group.
      properties:
        content_guid:
          description: The unique identifier of the content item.
          example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
          format: uuid
          type: string
        content_name:
          description: The name of the content item.
          type: string
        content_title:
          description: The title of the content item.
          type: string
        access_type:
          description: The access type of the content item.
          example: acl
          type: string
        permissions:
          description: 'List of principals (users and groups) with access to the content.

            The owner is listed as `author` and is always present.'
          items:
            $ref: '#/components/schemas/GroupOwnershipPermission'
          type: array
      type: object
    Group:
      allOf:
      - $ref: '#/components/schemas/TrustedPublisher'
      - properties:
          guid:
            description: The unique identifier
            example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
            format: uuid
            type: string
          member_count:
            description: The number of members in the group.
            example: 3
            format: int64
            type: integer
        type: object
      description: A group object.
    GroupOwnershipPermission:
      additionalProperties: false
      description: A principal with access to a content item.
      properties:
        principal_guid:
          description: The identifier of the principal (user or group) with access to the content.
          example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
          format: uuid
          type: string
        principal_name:
          description: The name of the principal (user or group) with access to the content.
          type: string
        principal_role:
          description: The role of the principal (user or group) with access to the content.
          example: author
          type: string
        principal_type:
          description: The type of the principal (user or group) with access to the content.
          example: user
          type: string
      type: object
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          nullable: true
          type: object
      required:
      - code
      - error
      type: object
    GroupWithTicket:
      additionalProperties: false
      description: A group object with a temporary ticket for remote group creation.
      properties:
        name:
          description: The group name
          example: accounting
          type: string
        guid:
          description: 'The group''s unique identifier in

            [RFC4122](https://tools.ietf.org/html/rfc4122) format. When

            a group does not exist in the Posit Connect server, this

            property will be `null`.'
          example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
          format: uuid
          nullable: true
          type: string
        temp_ticket:
          description: 'This value is for actions that require a `temp_ticket`, such

            as adding an LDAP group to the Connect server.'
          type: string
      type: object
    GroupRemoteSearch:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            description: The groups list
            items:
              $ref: '#/components/schemas/GroupWithTicket'
            type: array
        type: object
      description: The remote group search results with paging information.
    GroupMembers:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            description: The group members list
            items:
              $ref: '#/components/schemas/GroupMember'
            type: array
        type: object
      description: The group members list with paging information.
    GroupCreateRemoteInput:
      additionalProperties: false
      description: The fields that must be specified when creating a remote group.
      properties:
        temp_ticket:
          description: 'The temporary ticket used for creating a group on the

            Posit Connect server. It is obtained from the

            [GET /v1/groups/remote](#searchRemoteGroups) endpoint.'
          type: string
      type: object
    GroupMemberAddInput:
      additionalProperties: false
      description: The fields that must be specified when adding a member to a group.
      properties:
        user_guid:
          description: The user's unique identifier
          example: 6f300623-1e0c-48e6-a473-ddf630c0c0c3
          format: uuid
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

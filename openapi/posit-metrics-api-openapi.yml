openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference Metrics API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: Metrics
paths:
  /v1/metrics/users/active:
    get:
      description: 'Returns counts of licensed users that were active within the

        last 1, 7, 30, and 365 days, broken down by role (admin,

        publisher, viewer).


        This endpoint requires administrator access.'
      operationId: getActiveUserCounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveUsersResponse'
          description: Successful response.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get active user counts
      tags:
      - Metrics
components:
  schemas:
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    ActiveUsersWindowCounts:
      additionalProperties: false
      description: User counts for a single time window, broken down by role.
      properties:
        total:
          description: Total number of distinct active licensed users in the window.
          type: integer
        admin:
          description: Number of active administrators in the window.
          type: integer
        publisher:
          description: Number of active publishers in the window.
          type: integer
        viewer:
          description: Number of active viewers in the window.
          type: integer
      type: object
    ActiveUsersResponse:
      additionalProperties: false
      description: Active user counts indexed by time window.
      properties:
        windows:
          additionalProperties:
            $ref: '#/components/schemas/ActiveUsersWindowCounts'
          description: 'A map from time-window label to the user counts for that

            window. The keys are `1d`, `7d`, `30d`, and `365d`, and each

            value is an ActiveUsersWindowCounts object.'
          type: object
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

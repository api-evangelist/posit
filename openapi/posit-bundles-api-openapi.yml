components:
  schemas:
    Bundle:
      additionalProperties: false
      description: A deployment bundle associated with a content item.
      properties:
        id:
          description: The identifier for this bundle.
          example: '101'
          type: string
        content_guid:
          description: The identifier of the owning content.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        created_by:
          description: The GUID of the user who created the bundle.
          format: uuid
          nullable: true
          type: string
        created_time:
          description: The timestamp (RFC3339) of when this bundle was created.
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        environment_guid:
          description: 'The guid of the execution environment used to run this content. Content

            running locally

            on the same server as Connect will have a `null` value.


            A `null` value is returned when the client does not have sufficient rights

            to see this

            information.'
          example: 36538b83-ea6d-4839-ae8e-53c52ac5f0bf
          format: uuid
          nullable: true
          type: string
        cluster_name:
          description: 'The location where this content runs. Content running on the same

            server as Connect will have either a `null` value or the string

            "Local". Gives the name of the cluster when run external to the

            Connect host.


            A `null` value is returned when the client does not have sufficient

            rights to see this information.'
          example: Local
          nullable: true
          type: string
        image_name:
          description: 'The name of the container image used to run this content in containerized

            environments such as Kubernetes. Content running locally

            on the same server as Connect will have either a `null` value or the string

            "Local".


            A `null` value is returned when the client does not have sufficient

            rights to see this information.'
          example: rstudio/content-base:r4.1.3-py3.10.11-jammy
          nullable: true
          type: string
        r_version:
          description: 'The version of R used when last restoring this bundle. A `null`

            value represents that R is not used by this bundle or that the

            bundle has not been prepared for execution.


            R version is not disclosed to users with a "viewer" role; they

            receive a `null` value.'
          example: 3.5.1
          nullable: true
          type: string
        r_environment_management:
          description: 'Indicates whether or not Connect is managing an R environment and

            has installed the required packages for this content. The `null`

            value represents that R is not used by this bundle or that it has

            not yet been determined if an R environment is required.


            R environment management is not disclosed to users with a "viewer"

            role; they receive a `null` value.'
          example: true
          nullable: true
          type: boolean
        py_version:
          description: 'The version of Python used when last restoring this bundle. A `null`

            value represents that Python is not used by this bundle or that the

            bundle has not been prepared for execution.


            Python version is not disclosed to users with a "viewer" role; they

            receive a `null` value.'
          example: 3.8.2
          nullable: true
          type: string
        py_environment_management:
          description: 'Indicates whether or not Connect is managing a Python environment

            and has installed the required packages for this content. The `null`

            value represents that Python is not used by this bundle or that it

            has not yet been determined if a Python environment is required.


            Python environment management is not disclosed to users with a

            "viewer" role; they receive a `null` value.'
          example: true
          nullable: true
          type: boolean
        quarto_version:
          description: 'The version of Quarto used when last restoring this bundle. A `null`

            value represents that Quarto is not used by this bundle or that the

            bundle has not been successfully prepared for execution.


            Quarto version is not disclosed to users with a "viewer" role; they

            receive a `null` value.'
          example: 0.2.22
          nullable: true
          type: string
        active:
          description: Indicates if this bundle is active for the owning content.
          example: false
          type: boolean
        size:
          description: 'On-disk size in bytes of the tar.gz file associated with this bundle.

            Zero when there is no on-disk file.'
          example: 1000000
          format: int64
          type: integer
        metadata:
          allOf:
          - $ref: '#/components/schemas/BundleMetadata'
          description: 'Metadata object associated with this bundle.

            May be generated by Connect, if using git-backed publishing,

            or supplied by the publisher at upload time.'
      type: object
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          nullable: true
          type: object
      required:
      - code
      - error
      type: object
    BundleMetadata:
      additionalProperties: false
      description: Metadata about a bundle including source control information and custom fields.
      properties:
        source:
          description: 'Source for this bundle.

            `git` for bundles fetched from a git repository.'
          nullable: true
          type: string
        source_repo:
          description: Repository URL for this bundle.
          nullable: true
          type: string
        source_branch:
          description: Repository branch or ref name for this bundle.
          nullable: true
          type: string
        source_commit:
          description: Commit ID (hash) for this bundle.
          nullable: true
          type: string
        archive_md5:
          description: 'MD5 hash of the archive file for this bundle. `null` for bundles

            uploaded before this field was added.'
          example: 37324238a80595c453c706b22adb83d3
          nullable: true
          type: string
        archive_sha1:
          description: 'SHA1 hash of the archive file for this bundle. `null` for bundles

            uploaded before this field was added.'
          example: a2f7d13d87657df599aeeabdb70194d508cfa92f
          nullable: true
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: OAuth Integrations
paths:
  /v1/oauth/integrations:
    get:
      description: 'List all OAuth integrations available to Posit Connect.

        You must have administrator or publisher privileges to perform this action.'
      operationId: listOAuthIntegrations
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAuthIntegration'
                type: array
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List OAuth integrations
      tags:
      - OAuth Integrations
    post:
      description: 'Create a new OAuth integration.

        You must have administrator privileges to perform this action.'
      operationId: createOAuthIntegration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthIntegrationInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthIntegration'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires payment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Create an OAuth integration
      tags:
      - OAuth Integrations
  /v1/oauth/integrations/credentials:
    post:
      description: 'This endpoint facilitates an [OAuth Token Exchange](https://datatracker.ietf.org/doc/html/rfc8693) by

        exchanging a Connect-provided credential for OAuth credentials.


        There are several types of OAuth token exchanges supported by this endpoint. It allows content

        owners to exchange the viewer''s Connect credentials for the viewer''s OAuth credentials, and it allows executing content

        to exchange its own Connect credentials for the OAuth credentials associated with a service account.


        This endpoint can only be called _from content that is running on Posit Connect_ because the Connect-provided

        credentials required by the endpoint are only available in that context. See the `subject_token` property for details.


        In the case of a *Viewer credential exchange*, this endpoint requires that the content viewer first perform an OAuth

        login by visiting the login endpoint of the OAuth integration in their browser.

        The login endpoint is located at `__oauth__/integrations/:guid/login`.


        Once the viewer has successfully initialized an OAuth session for the OAuth integration by visiting the login endpoint,

        the content can then exchange the viewer''s `user-session-token` for the viewer''s OAuth credentials.


        OAuth credential refresh is handled automatically by Connect. Repeated requests to this endpoint will return

        the same OAuth credentials until they expire. When the OAuth credentials expire, the next request to this endpoint

        will return a refreshed set of OAuth credentials.


        You must have administrator or publisher privileges to perform this action.

        Additionally, the requester _must_ be owner of the content where the credential exchange request originated.

        Finally, the user whose OAuth credentials are being requested must have viewer permissions on the content.


        In the case of a *Service Account credential exchange*, this endpoint will return a fresh OAuth access token to the

        requesting content item on every request. There is no login redirect or refresh token management. You must have administrator

        or publisher privileges to perform this action. The requester _must_ be owner of the content where the credential exchange

        request originated.'
      operationId: exchangeCredentials
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              additionalProperties: false
              properties:
                audience:
                  description: Identifies the integration for which the OAuth credentials are being requested.
                  type: string
                grant_type:
                  description: Indicates that an OAuth Token Exchange is being requested. The value is always "urn:ietf:params:oauth:grant-type:token-exchange".
                  type: string
                requested_token_type:
                  description: Identifies the type of token being requested.
                  type: string
                subject_token:
                  description: An opaque string that is used to identify the consumer of the OAuth access token.
                  type: string
                subject_token_type:
                  description: Identifies the type of subject_token in use.
                  type: string
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCredentials'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires payment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Exchange Connect credentials for OAuth credentials
      tags:
      - OAuth Integrations
  /v1/oauth/integrations/{guid}:
    delete:
      description: 'Delete the OAuth integration associated with the provided guid.

        You must have administrator privileges to perform this action.'
      operationId: deleteOAuthIntegration
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Delete an OAuth integration
      tags:
      - OAuth Integrations
    get:
      description: 'Get detailed information about a specific OAuth integration.

        You must have administrator or publisher privileges to perform this action.'
      operationId: getOAuthIntegration
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthIntegration'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get OAuth integration details
      tags:
      - OAuth Integrations
    patch:
      description: 'Update a specific OAuth integration.

        You must have administrator privileges to perform this action.'
      operationId: updateOAuthIntegration
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthIntegrationUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthIntegration'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires payment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Update an OAuth integration
      tags:
      - OAuth Integrations
  /v1/oauth/integrations/{guid}/associations:
    get:
      description: 'List all associations for this OAuth integration.

        You must have administrator privileges to perform this action.'
      operationId: listOAuthIntegrationAssociations
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OAuthIntegrationAssociationOutput'
                type: array
          description: Successful response.
        '400':
          content:
            application/json:

        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Verify that an OAuth service account integration is configured correctly
      tags:
      - OAuth Integrations
components:
  schemas:
    OAuthIntegrationUpdate:
      additionalProperties: false
      description: The fields that can be specified when updating an OAuth integration.
      properties:
        name:
          description: A descriptive name to identify each OAuth integration.
          example: databricks
          type:
          - string
          - 'null'
        description:
          description: A brief text to describe each OAuth integration.
          example: Integration with external system
          type:
          - string
          - 'null'
        config:
          additionalProperties: true
          description: 'The OAuth integration configuration based on the template.

            See List OAuth templates for more information on available fields for each

            template.

            The configuration combines elements from both options and fields from a

            given template.


            For example, given the following OAuthTemplateOptions:


            ```

            ...

            "options": [{

            ...

            "name": "auth_mode",

            "type": "select",

            "values": ["Confidential", "Public"]

            },

            ...

            }],

            "fields": [{

            ...

            "name": "client_id",

            "label": "Client ID"

            },

            ...

            }]

            ...

            ```


            A valid OAuthIntegration `config` would be:


            ```

            {

            ...

            "config": {

            "auth_mode": "Public",

            "client_id": "1b9b9733-43f5-4848-a894-f753f2fbaf41",

            ...

            }

            }

            ```'
          type: object
        permissions:
          description: 'An optional list of permissions to grant access to this OAuth integration.

            Each permission record specifies a user or group that can access the

            integration.

            When provided, this replaces the existing permissions for the integration.'
          items:
            $ref: '#/components/schemas/OAuthIntegrationPermissionInput'
          type:
          - array
          - 'null'
      type: object
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    OAuthIntegration:
      additionalProperties: false
      description: OAuthIntegration represents a custom OAuth integration available in Posit Connect.
      properties:
        id:
          description: The internal numeric identifier of this OAuth integration.
          example: '123'
          type: string
        guid:
          description: 'The unique identifier of this OAuth integration which is used in REST API

            requests.'
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        created_time:
          description: The timestamp (RFC3339) indicating when this OAuth integration was created.
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        updated_time:
          description: 'The timestamp (RFC3339) indicating when this OAuth integration was last

            updated.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        name:
          description: A descriptive name to identify each OAuth integration.
          type:
          - string
          - 'null'
        description:
          description: A brief text to describe each OAuth integration.
          example: Integration with external system
          type:
          - string
          - 'null'
        template:
          description: 'The template to use to configure this OAuth integration. See List OAuth

            templates for more information.'
          example: custom
          type:
          - string
          - 'null'
        auth_type:
          description: 'The authentication type indicates which OAuth flow is used by this

            integration. The "Viewer" authentication type corresponds to the

            Authorization Code flow. The "Service Account" authentication type

            corresponds to the Client Credentials flow.'
          example: Viewer
          type:
          - string
          - 'null'
        config:
          additionalProperties: true
          description: 'The OAuth integration configuration based on the template. See List OAuth

            templates for more

            information on available fields for each template. The configuration

            combines elements from both

            options and fields from a given template.


            For example, given the following template section:


            ```

            ...

            "options": [{

            ...

            "name": "auth_mode",

            "type": "select",

            "values": ["Confidential", "Public"]

            },

            ...

            }],

            "fields": [{

            ...

            "name": "client_id",

            "label": "Client ID"

            },

            ...

            }]

            ...

            ```


            A valid OAuthIntegration `config` would be:


            ```

            {

            ...

            "config": {

            "auth_mode": "Public",

            "client_id": "1b9b9733-43f5-4848-a894-f753f2fbaf41",

            ...

            }

            }

            ```'
          type: object
        permissions:
          description: 'A list of permission records that define which users or groups have access

            to this OAuth integration.'
          items:
            $ref: '#/components/schemas/OAuthIntegrationPermission'
          type: array
        environment_variables:
          description: The names of the environment variables provisioned by this OAuth integration.
          items:
            type: string
          type: array
        content_count:
          description: 'The number of content items currently using this OAuth integration.

            This field is only included for administrators.'
          example: 5
          format: int64
          type:
          - integer
          - 'null'
      type: object
    OAuthIntegrationAssociationOutput:
      additionalProperties: false
      description: Represents an association between a content item and an OAuth integration.
      properties:
        app_guid:
          description: This field is deprecated and has been renamed to `content_guid`.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        content_guid:
          description: The unique identifier of the content item.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        oauth_integration_guid:
          description: The unique identifier of an existing OAuth integration.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        oauth_integration_name:
          description: A descriptive name that identifies the OAuth integration.
          example: Databricks Integration
          type:
          - string
          - 'null'
        oauth_integration_description:
          description: A brief text that describes the OAuth integration.
          example: Integration with external system
          type:
          - string
          - 'null'
        oauth_integration_template:
          description: The template used to configure this OAuth integration.
          example: custom
          type:
          - string
          - 'null'
        oauth_integration_auth_type:
          description: 'Indicates which OAuth flow is used by this integration. The

            "Viewer" authentication type corresponds to the Authorization Code

            flow. The "Service Account" authentication type corresponds to the

            Client Credentials flow.'
          example: Viewer
          type:
          - string
          - 'null'
        created_time:
          description: The timestamp (RFC3339) indicating when this association was created.
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
      type: object
    OAuthCredentials:
      additionalProperties: false
      properties:
        access_token:
          description: 'The user''s token which is accepted by the external resource. If

            `issued_token_type` is `urn:ietf:params:aws:token-type:credentials`, then

            this field will contain base64-encoded JSON containing temporary AWS

            credentials.


            https://datatracker.ietf.org/doc/html/rfc8693#section-2.2.1-2.2'
          type:
          - string
          - 'null'
        issued_token_type:
          description: 'The type of token stored in the access_token field.


            https://datatracker.ietf.org/doc/html/rfc8693#section-2.2.1-2.4'
          example: urn:ietf:params:oauth:token-type:access_token
          type:
          - string
          - 'null'
        token_type:
          description: 'The method by which the access_token should be provided to the external

            resource.


            https://datatracker.ietf.org/doc/html/rfc8693#section-2.2.1-2.6'
          example: Bearer
          type:
          - string
          - 'null'
        expires_in:
          description: 'The remaining time before the returned token expires, expressed in seconds.


            This value is only returned if expiry information is available for the

            token. For example, if an external OAuth service does not provide expiry

            information to Connect, this value can''t be returned in the response.


            Token expiration is calulated relative to the current UTC time, *not* local

            time.


            https://datatracker.ietf.org/doc/html/rfc8693#section-2.2.1-2.8'
          example: 3600
          format: int64
          type:
          - integer
          - 'null'
      type: object
    OAuthIntegrationInput:
      additionalProperties: false
      description: The fields that can be specified when creating an OAuth integration.
      properties:
        name:
          description: A descriptive name to identify each OAuth integration.
          example: Databricks Integration
          type:
          - string
          - 'null'
        description:
          description: A brief text to describe each OAuth integration.
          example: Integration with external system
          type:
          - string
          - 'null'
        template:
          description: 'The template to use to configure this OAuth integration. See List OAuth

            templates for more information.'
          example: custom
          type: string
        config:
          additionalProperties: true
          description: 'The OAuth integration configuration based on the template.

            See List OAuth templates for more information on available fields for each

            template.

            The configuration combines elements from both options and fields from a

            given template.


            For example, given the following OAuthTemplateOptions:


            ```

            ...

            "options": [{

            ...

            "name": "auth_mode",

            "type": "select",

            "values": ["Confidential", "Public"]

            },

            ...

            }],

            "fields": [{

            ...

            "name": "client_id",

            "label": "Client ID"

            },

            ...

            }]

            ...

            ```


            A valid OAuthIntegration `config` would be:


            ```

            {

            ...

            "config": {

            "auth_mode": "Public",

            "client_id": "1b9b9733-43f5-4848-a894-f753f2fbaf41",

            ...

            }

            }

            ```'
          type: object
        permissions:
          description: 'An optional list of permissions to grant access to this OAuth integration.

            Each permission record specifies a user or group that can access the

            integration.'
          items:
            $ref: '#/components/schemas/OAuthIntegrationPermissionInput'
          type:
          - array
          - 'null'
      type: object
    OAuthIntegrationPermissionInput:
      additionalProperties: false
      description: 'The fields that can be specified when adding permissions to an OAuth integration.

        Note that only one of user_guid or group_guid can be specified in a single request.'
      properties:
        user_guid:
          description: 'The identifier of the user. Do not specify this field if you

            are adding a group.'
          example: 89a3c946-d73c-4781-8463-dd3cccff3fef
          format: uuid
          type:
          - string
          - 'null'
        group_guid:
          description: 'The identifier of the group. Do not specify this field if you

            are adding a user.'
          example: 998f3356-96f0-48a2-9655-94334615fa5b
          format: uuid
          type:
          - string
          - 'null'
      type: object
    OAuthIntegrationPermission:
      additionalProperties: false
      description: 'Represents a permission record associated with an OAuth integration that

        defines which users or groups can access the integration.'
      properties:
        id:
          description: The internal identifier for this permission entry.
          example: '101'
          type: string
        guid:
          description: The identifier for this permission entry.

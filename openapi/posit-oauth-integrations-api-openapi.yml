              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List all associations for this OAuth integration.
      tags:
      - OAuth Integrations
  /v1/oauth/integrations/{guid}/verify:
    post:
      description: 'This endpoint simulates a content session token exchange with the OAuth integration to

        verify that the integration is configured correctly. No access token is returned.

        Verification is only available for OAuth integrations with the "Service Account" authentication type.

        If the integration is not a service account integration, a 400 status code will be returned.

        You must have administrator privileges to perform this action.'
      operationId: verifyServiceAccountIntegration
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires payment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Verify that an OAuth service account integration is configured correctly.
      tags:
      - OAuth Integrations
components:
  schemas:
    OAuthCredentials:
      additionalProperties: false
      properties:
        access_token:
          description: 'The user''s token which is accepted by the external resource. If

            `issued_token_type` is `urn:ietf:params:aws:token-type:credentials`, then

            this field will contain base64-encoded JSON containing temporary AWS

            credentials.


            https://datatracker.ietf.org/doc/html/rfc8693#section-2.2.1-2.2'
          nullable: true
          type: string
        issued_token_type:
          description: 'The type of token stored in the access_token field.


            https://datatracker.ietf.org/doc/html/rfc8693#section-2.2.1-2.4'
          example: urn:ietf:params:oauth:token-type:access_token
          nullable: true
          type: string
        token_type:
          description: 'The method by which the access_token should be provided to the external

            resource.


            https://datatracker.ietf.org/doc/html/rfc8693#section-2.2.1-2.6'
          example: Bearer
          nullable: true
          type: string
        expires_in:
          description: 'The remaining time before the returned token expires, expressed in seconds.


            This value is only returned if expiry information is available for the

            token. For example, if an external OAuth service does not provide expiry

            information to Connect, this value can''t be returned in the response.


            Token expiration is calulated relative to the current UTC time, *not* local

            time.


            https://datatracker.ietf.org/doc/html/rfc8693#section-2.2.1-2.8'
          example: 3600
          format: int64
          nullable: true
          type: integer
      type: object
    OAuthIntegration:
      additionalProperties: false
      description: OAuthIntegration represents a custom OAuth integration available in Posit Connect.
      properties:
        id:
          description: The internal numeric identifier of this OAuth integration.
          example: '123'
          type: string
        guid:
          description: 'The unique identifier of this OAuth integration which is used in REST API

            requests.'
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        created_time:
          description: The timestamp (RFC3339) indicating when this OAuth integration was created.
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        updated_time:
          description: 'The timestamp (RFC3339) indicating when this OAuth integration was last

            updated.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        name:
          description: A descriptive name to identify each OAuth integration.
          nullable: true
          type: string
        description:
          description: A brief text to describe each OAuth integration.
          example: Integration with external system
          nullable: true
          type: string
        template:
          description: 'The template to use to configure this OAuth integration. See List OAuth

            templates for more information.'
          example: custom
          nullable: true
          type: string
        auth_type:
          description: 'The authentication type indicates which OAuth flow is used by this

            integration. The "Viewer" authentication type corresponds to the

            Authorization Code flow. The "Service Account" authentication type

            corresponds to the Client Credentials flow.'
          example: Viewer
          nullable: true
          type: string
        config:
          additionalProperties: true
          description: 'The OAuth integration configuration based on the template. See List OAuth

            templates for more

            information on available fields for each template. The configuration

            combines elements from both

            options and fields from a given template.


            For example, given the following template section:


            ```

            ...

            "options": [{

            ...

            "name": "auth_mode",

            "type": "select",

            "values": ["Confidential", "Public"]

            },

            ...

            }],

            "fields": [{

            ...

            "name": "client_id",

            "label": "Client ID"

            },

            ...

            }]

            ...

            ```


            A valid OAuthIntegration `config` would be:


            ```

            {

            ...

            "config": {

            "auth_mode": "Public",

            "client_id": "1b9b9733-43f5-4848-a894-f753f2fbaf41",

            ...

            }

            }

            ```'
          type: object
        permissions:
          description: 'A list of permission records that define which users or groups have access

            to this OAuth integration.'
          items:
            $ref: '#/components/schemas/OAuthIntegrationPermission'
          type: array
        environment_variables:
          description: The names of the environment variables provisioned by this OAuth integration.
          items:
            type: string
          type: array
        content_count:
          description: 'The number of content items currently using this OAuth integration.

            This field is only included for administrators.'
          example: 5
          format: int64

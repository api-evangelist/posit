  /v1/oauth/integrations/{guid}/associations:
    get:
      description: 'List all associations for this OAuth integration.

        You must have administrator privileges to perform this action.'
      operationId: listOAuthIntegrationAssociations
      parameters:
      - in: path
        name: guid
        required: true

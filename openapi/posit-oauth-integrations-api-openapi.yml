    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference OAuth Integrations API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: OAuth Integrations
paths:
  /v1/oauth/integrations:
    get:
      description: 'List all OAuth integrations available to Posit Connect.

        You must have administrator or publisher privileges to perform this action.'
      operationId: listOAuthIntegrations

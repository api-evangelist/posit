openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference Storage API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: Storage
paths:
  /v1/content/storage:
    get:
      description: 'Returns a paginated list of content items with their bundle storage

        aggregates. Useful for identifying which content items consume the

        most storage.


        Results can be sorted by total bundle bytes, active bundle bytes,

        inactive bundle bytes, or bundle count.


        This endpoint requires authentication and is only available to users

        with the `administrator` role.'
      operationId: getContentStorageList
      parameters:
      - description: The page number to return.
        in: query
        name: page_number
        schema:
          default: 1
          format: int64
          type: integer
      - description: The number of items per page.
        in: query
        name: page_size
        schema:
          default: 20
          format: int64
          type: integer
      - description: The field to sort by.
        in: query
        name: sort
        schema:
          type: string
      - description: 'The sort order: asc or desc.'
        in: query
        name: order
        schema:
          enum:
          - asc
          - desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStorageList'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List content storage usage
      tags:
      - Storage
  /v1/content/{guid}/storage:
    get:
      description: 'Returns detailed storage information for a specific content item,

        including per-bundle size data.


        This endpoint requires authentication and is only available to users

        with the `administrator` role.'
      operationId: getContentStorageDetail
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStorageDetail'
          description: Successful response.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get content storage details
      tags:
      - Storage
components:
  schemas:
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    ContentStorageListItemBundles:
      additionalProperties: false
      description: Bundle storage metrics for a content item.
      properties:
        count:
          description: The number of bundles for this content item.
          example: 14
          type: integer
        bytes_total:
          description: Total bytes across all bundles for this content.
          example: 1073741824
          format: int64
          type: integer
        bytes_active:
          description: Bytes used by the currently active (deployed) bundle.
          example: 104857600
          format: int64
          type: integer
        bytes_inactive:
          description: Bytes used by inactive (historical) bundles.
          example: 968884224
          format: int64
          type: integer
      type: object
    ContentStorageDetail:
      additionalProperties: false
      description: Detailed storage information for a content item, including per-bundle sizes.
      properties:
        content_guid:
          description: The unique identifier of the content item.
          example: abc12345-6789-0abc-def0-123456789abc
          format: uuid
          type: string
        content_name:
          description: The name of the content item.
          example: My Dashboard
          type: string
        owner_guid:
          description: The unique identifier of the content owner. Null if the content has no owner.
          example: def45678-9012-3def-4567-890123456789
          format: uuid
          type:
          - string
          - 'null'
        owner_username:
          description: The username of the content owner. Null if the content has no owner.
          example: jsmith
          type:
          - string
          - 'null'
        bundle_count:
          description: The number of bundles for this content item.
          example: 14
          type: integer
        bundle_bytes_total:
          description: Total bytes across all bundles for this content.
          example: 1073741824
          format: int64
          type: integer
        bundle_bytes_active:
          description: Bytes used by the currently active (deployed) bundle.
          example: 104857600
          format: int64
          type: integer
        bundle_bytes_inactive:
          description: Bytes used by inactive (historical) bundles.
          example: 968884224
          format: int64
          type: integer
        bundles:
          description: Per-bundle storage details, sorted by creation time (newest first).
          items:
            $ref: '#/components/schemas/ContentBundleStorageDetail'
          type: array
      type: object
    ContentStorageListItem:
      additionalProperties: false
      description: Storage metrics for a single content item.
      properties:
        content_guid:
          description: The unique identifier of the content item.
          example: abc12345-6789-0abc-def0-123456789abc
          format: uuid
          type: string
        content_name:
          description: The URL-safe name of the content item.
          example: my-dashboard
          type: string
        content_title:
          description: The human-friendly title of the content item, or null if not set.
          example: My Dashboard
          type:
          - string
          - 'null'
        owner_guid:
          description: The unique identifier of the content owner, or null if the owner has been deleted.
          example: def12345-6789-0abc-def0-123456789abc
          format: uuid
          type:
          - string
          - 'null'
        owner_username:
          description: The username of the content owner, or null if the owner has been deleted.
          example: jsmith
          type:
          - string
          - 'null'
        app_mode:
          description: The type of content (e.g., shiny, rmd, python-api).
          example: shiny
          type: string
        bundles:
          allOf:
          - $ref: '#/components/schemas/ContentStorageListItemBundles'
          description: Bundle storage metrics for this content item.
      type: object
    ContentBundleStorageDetail:
      additionalProperties: false
      description: Storage information for a single bundle.
      properties:
        id:
          description: The identifier for this bundle.
          example: '7'
          type: string
        created_time:
          description: The timestamp (RFC3339) of when this bundle was created.
          example: '2026-01-15T10:30:00Z'
          format: date-time
          type: string
        size_bytes:
          description: The size of the bundle archive in bytes.
          example: 104857600
          format: int64
          type: integer
        is_active:
          description: Whether this is the currently deployed bundle.
          example: true
          type: boolean
      type: object
    ContentStorageList:
      additionalProperties: false
      description: Paginated list of content items with storage metrics.
      properties:
        results:
          description: The list of content items for this page.
          items:
            $ref: '#/components/schemas/ContentStorageListItem'
          type: array
        current_page:
          description: The current page number.
          example: 1
          format: int64
          type: integer
        total:
          description: The total number of content items.
          example: 542
          type: integer
        total_pages:
          description: The total number of pages.
          example: 28
          type: integer
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

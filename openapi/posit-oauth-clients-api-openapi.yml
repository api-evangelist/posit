openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference OAuth Clients API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: OAuth Clients
paths:
  /v1/oauth/clients:
    get:
      description: List all registered OAuth clients. You must be authenticated.
      operationId: listOAuthClients
      parameters:
      - description: The page number to return.
        in: query
        name: page_number
        schema:
          default: 1
          format: int32
          type: integer
      - description: The number of items per page.
        in: query
        name: page_size
        schema:
          default: 20
          format: int32
          type: integer
      - description: Whether results are in ascending order.
        in: query
        name: asc_order
        schema:
          default: true
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClients'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List registered OAuth clients
      tags:
      - OAuth Clients
  /v1/oauth/clients/{client_id}:
    delete:
      description: 'Delete the OAuth client associated with the provided client_id.

        You must have administrator privileges to perform this action.'
      operationId: deleteOAuthClient
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Delete an OAuth client
      tags:
      - OAuth Clients
    get:
      description: Get the OAuth client associated with the provided client_id. You must be authenticated.
      operationId: getOAuthClient
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get an OAuth client
      tags:
      - OAuth Clients
components:
  schemas:
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    OffsetPaging:
      description: Offset-based pagination metadata.
      properties:
        current_page:
          description: The current page of results
          example: 1
          format: int32
          type: integer
        total:
          description: The number of items that match the given filters
          example: 1
          format: int32
          type: integer
      type: object
    OAuthClient:
      additionalProperties: false
      description: OAuthClient represents a registered OAuth client in Posit Connect.
      properties:
        id:
          description: The internal numeric identifier of this OAuth client.
          type: string
        client_id:
          description: The OAuth client_id string used during authorization flows.
          type: string
        client_name:
          description: An optional human-readable name for this OAuth client.
          type:
          - string
          - 'null'
        redirect_uris:
          description: The redirect URIs registered for this OAuth client.
          items:
            type: string
          type: array
        created_at:
          description: The timestamp (RFC3339) when this OAuth client was registered.
          format: date-time
          type: string
        last_used_at:
          description: The timestamp (RFC3339) when this OAuth client was last used, or null if never used.
          format: date-time
          type:
          - string
          - 'null'
      type: object
    OAuthClients:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            items:
              $ref: '#/components/schemas/TrustedPublisher'
            type: array
        type: object
      description: A paginated list of OAuth clients.
    TrustedPublisher:
      description: 'A binding that allows a service principal (a machine identity such as a

        GitHub Actions workflow) to publish to a single content item. A workload

        that authenticates as the service principal can upload bundles and deploy

        this content, but cannot act on any other content.'
      properties:
        service_principal_guid:
          description: The GUID of the service principal bound to this content item.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        name:
          description: The descriptive name of the service principal.
          example: GitHub Actions (acme/web)
          type: string
        role:
          description: 'The auth role workloads authenticating as the service principal carry.

            Trusted publishers carry only the viewer role; their ability to publish

            comes from the per-content grant, not this role.'
          example: viewer
          type: string
        app_role:
          description: The content access level granted to the service principal on this item.
          example: editor
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
      type: apiKey

    put:
      description: 'Set a content thumbnail.


        Associate a content item with an image that is used as its thumbnail

        in the Connect dashboard content listing and settings view.


        #### Requesting a thumbnail


        The thumbnail is requested by appending a `__thumbnail__` path segment

        to the default content URL or a content vanity URL.


        For example, the thumbnail for a content item having the GUID

        `25438b83-ea6d-4839-ae8e-53c52ac5f9ce` and the vanity URL

        `/daily-summary/` is served at the URLs:


        * `https://connect.company.com/content/25438b83-ea6d-4839-ae8e-53c52ac5f9ce/__thumbnail__`

        * `https://connect.company.com/daily-summary/__thumbnail__`


        Thumbnail requests are subject to content access restrictions. An HTTP

        204 No Content is served when there is no thumbnail. Thumbnails are

        not served for incomplete content.'

openapi: 3.2.0
info:
  contact:
    email: support@posit.co
    name: Posit Connect Support
    url: https://support.posit.co/hc/en-us
  description: '## Overview


    The Posit Connect Server API can be used to perform certain

    user actions remotely.'
  license:
    name: Commercial. Copyright 2015-2026 Posit Software, PBC. All Rights Reserved.
    url: https://posit.co/about/eula/
  termsOfService: https://posit.co/about/eula/
  title: Posit Connect API Reference Content API
  version: 1.0.1
servers:
- url: /__api__
security:
- apiKey: []
tags:
- name: Content
paths:
  /v1/content:
    get:
      description: 'List all content items visible to the requesting user.


        Authenticated access from a user is required. If an "administrator"

        role is used, then all content items will be returned regardless of

        the visibility to the requesting user.


        Information about the target environment is populated for users with

        "publisher" and "administrator" role; it is suppressed for viewers.'
      operationId: getContents
      parameters:
      - description: 'The content name specified when the content was created.

          Content names are unique within the owning user''s account, so a

          request that specifies a non-empty name and owner_guid will return

          at most one content item.'
        in: query
        name: name
        schema:
          type: string
      - description: The unique identifier of the user who owns the content.
        in: query
        name: owner_guid
        schema:
          format: uuid
          type: string
      - description: 'Comma-separated set of values indicating additional details to include in the response.


          * `tags`: Populates a `tags` field for each returned content item

          containing the tags associated with this content item.

          * `owner`: Populates an `owner` field for each returned content

          item with basic details about the content owner.

          * `vanity_url`: Populates the `vanity_url` field for each returned

          content item if the content has an associated custom vanity URL.

          * `bookmarked`: Populates a `bookmarked` field for each returned

          content item indicating whether the requesting user has bookmarked

          the content.

          * `schedule`: Populates a `schedules` field for each returned

          content item with the list of schedules associated with the

          content, including variant details and last run information.

          '
        in: query
        name: include
        schema:
          enum:
          - tags
          - owner
          - vanity_url
          - bookmarked
          - schedule
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Content'
                type: array
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List content items
      tags:
      - Content
    post:
      description: Create a new content item.
      operationId: createContent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Create content item
      tags:
      - Content
  /v1/content/{guid}:
    delete:
      description: Delete a specific content item. On-disk data and database records are removed.
      operationId: deleteContent
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Delete content
      tags:
      - Content
    get:
      description: 'Get detailed information about a specific content item.


        Unauthenticated clients are rejected regardless of the content access

        type.


        Authorized, non-administrator clients without viewership rights to

        this content are rejected.


        Authorized, administrator clients without viewership rights are

        permitted to obtain information about this content. The computed

        `app_role` for these users will be `none`, representing that these

        users cannot view the content itself.


        Authorized clients with viewership (or collaborator) rights are

        permitted to obtain information about this content. The computed

        `app_role` for these users will reflect the level of access.


        Information about the target environment is populated for users with

        "publisher" and "administrator" role; it is suppressed for viewers.'
      operationId: getContent
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Comma-separated set of values indicating additional details to include in the response.


          * `tags`: Populates a `tags` field for each returned content item

          containing the tags associated with this content item.

          * `owner`: Populates an `owner` field for each returned content

          item with basic details about the content owner.

          * `vanity_url`: Populates the `vanity_url` field for each returned

          content item if the content has an associated custom vanity URL.

          * `bookmarked`: Populates a `bookmarked` field for each returned

          content item indicating whether the requesting user has bookmarked

          the content.

          * `schedule`: Populates a `schedules` field for each returned

          content item with the list of schedules associated with the

          content, including variant details and last run information.

          '
        in: query
        name: include
        schema:
          enum:
          - tags
          - owner
          - vanity_url
          - bookmarked
          - schedule
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get content details
      tags:
      - Content
    patch:
      description: 'Update fields for a specific content item.


        Authenticated access from a user having either "publisher" or

        "administrator" role is allowed. All other clients are rejected.


        Authorized clients with collaborator or administrator rights are

        permitted to modify content item fields.


        Administrators can reassign content ownership by updating

        the `owner_guid` field. The new owner must have publisher or

        administrator rights.'
      operationId: updateContent
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Update content
      tags:
      - Content
  /v1/content/{guid}/access-test:
    post:
      description: 'Trigger a Public Access Content Verification test for this content item.


        Checks if a content item is available and reachable on the public

        internet. If not, the result includes a message to help with

        troubleshooting. The verification process is identical to the test

        Connect performs automatically for all Public Access Content, but the

        API can provide more details about verification failures or

        immediately retest an item instead of waiting for the automatic

        verification to run.


        See the Admin Guide

        and User Guide

        for more information about Public Access Content Verification.


        To use this API, you must have a license with the Public Access

        entitlement, the content item must be interactive (e.g. Shiny

        applications, FastAPI APIs), and the content item must be configured

        with the "Anyone - no login required"/`all` access type.'
      operationId: testPublicAccess
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTestResult'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Triggers a Public Access Content Verification test
      tags:
      - Content
  /v1/content/{guid}/build:
    post:
      description: 'Build (restore) a deployment bundle.


        Build requests spawn an asynchronous task to make your previously

        uploaded data ready for rendering or running. Content will have its

        environment reconstructed, e.g. by using the packrat R package to

        install R package dependencies, but documents will not be re-rendered.


        Building is intended to facilitate server changes or migrations that

        may require re-installing R packages or other dependencies.


        By default, the built bundle becomes the active bundle for the content.

        You can prevent this by setting `activate: false` in the request body.

        This allows you to build a bundle without making it the active version.


        The response from this endpoint includes a task identifier. Poll the

        GET /v1/tasks/{id} endpoint to track the progress of this task.'
      operationId: buildContentBundle
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBuildInstructions'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBuildTask'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Build deployment bundle
      tags:
      - Content
  /v1/content/{guid}/deploy:
    post:
      description: 'Deploy (activate) a deployment bundle.


        Deployment requests spawn an asynchronous task to make your previously

        uploaded data available for serving. The workflow applied to the

        bundled files varies depending on the type of content.


        Executable content has its environment reconstructed. This includes

        using the packrat R package to install R package dependencies.


        Documents (R Markdown reports, Jupyter Notebooks, static Quarto content)

        are rendered and the result made available.


        Interactive content (applications and APIs) are available to be

        launched on the next client visit.


        The deployment workflow for static content (HTML, plots) is

        lighter-weight than for executable content. File time-stamps are

        updated to ensure that browsers do not cache previous results and

        instead see the newly promoted files.


        By default, the deployed bundle becomes the active bundle for the content.

        You can prevent this by setting `activate: false` in the request body.

        This allows you to deploy a bundle without making it the active version.


        The response from this endpoint includes a task identifier. Poll the

        GET /v1/tasks/{id} endpoint to track the progress of this task.'
      operationId: deployContentBundle
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentDeploymentInstructions'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDeploymentTask'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Deploy deployment bundle
      tags:
      - Content
  /v1/content/{guid}/environment:
    get:
      description: Get the names of the environment variables defined for this content.
      operationId: getContentEnvironment
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVariableNames'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get environment variables
      tags:
      - Content
    patch:
      description: Add, change, or delete environment variables for this content.
      operationId: updateContentEnvironment
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentVariables'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVariableNames'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Update environment variables
      tags:
      - Content
    put:
      description: Set the environment for this content item. Any existing environment variables will be removed.
      operationId: setContentEnvironment
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentVariables'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVariableNames'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Set all environment variables
      tags:
      - Content
  /v1/content/{guid}/lockfile:
    get:
      description: 'Get the Python lockfile (`requirements.txt.lock`) for a content item''s

        active bundle.


        This endpoint returns the lockfile that describes the exact Python

        packages installed in Connect''s managed Python environment for this

        content. The file can be used to recreate the same Python environment

        elsewhere.


        The content must have a managed Python environment

        (`py_environment_management` enabled). Returns an error if the content

        does not use Python or does not have environment management enabled.'
      operationId: getContentLockfile
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get Python lockfile
      tags:
      - Content
  /v1/content/{guid}/oauth/integrations/associations:
    get:
      description: List all OAuth integration associations for this content item.
      operationId: listContentOAuthIntegrationAssociations
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthIntegrationAssociationOutput'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: List all OAuth integration associations for this content item
      tags:
      - Content
    put:
      description: Replaces any existing associations for a piece of content with the given list.
      operationId: setOAuthIntegrationAssociations
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthIntegrationAssociationInput'
        required: true
      responses:
        '204':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Set all OAuth integration associations
      tags:
      - Content
  /v1/content/{guid}/packages:
    get:
      description: 'Get the names and versions of all packages

        installed for this content. Returned packages are sorted

        by language and then by package name.


        If the content is not yet deployed, an HTTP 204 No Content

        response is returned. If the content environment is being

        rebuilt, package information from before the rebuild

        will be returned.


        Note that a content item may include packages that are not explicitly requested

        in the `manifest.json` or `requirements.txt` file used during deployment. These include

        packages that are:

        - Installed as dependencies of the explicitly requested packages,

        - Installed by Connect in order to render or serve the content item,

        - Installed in the base Python installation and inherited by the content item, or

        - Listed under `R.External` in the Connect configuration file.'
      operationId: getContentPackages
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPackages'
          description: Successful response.
        '204':
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested object does not exist.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Get package dependencies
      tags:
      - Content
  /v1/content/{guid}/render:
    post:
      description: 'Render a specific content item.


        Render requests spawn an asynchronous task to re-render static reports

        (R Markdown documents, Jupyter Notebooks, or Quarto documents). The

        rendered output becomes the active rendering for the variant.


        By default, the default variant is rendered. You can render a specific

        variant by providing its key in the request body.


        Users with "editor" or higher role on the content can render any public

        variant, and private variants they own. Users with "viewer" role can

        only render ad-hoc variants when the

        `Applications.ViewerOnDemandReports` server setting is enabled.


        The response from this endpoint includes a task identifier. Poll the

        GET /v1/tasks/{id} endpoint to track the progress of this task.'
      operationId: renderContent
      parameters:
      - in: path
        name: guid
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRenderInstructions'
        required: true
      responses:
        '202':
          content:

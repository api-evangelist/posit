  /v1/search/content:
    get:
      description: "This endpoint searches for content items, using a search query format\nthat allows for both search terms and filters. The search terms are used\nto find content items that have matching terms in the title,\ndescription, etc, while the filters are used to filter the search\nresults by specific fields (such as `owner` or content `type`).\n\nAuthenticated access is required, and only content items visible to the\nrequesting user are returned. If an Administrator role is used,\nthen all content items are returned regardless of the visibility to\nthe requesting user.\n\n#### Service tokens\n\nThis endpoint can be accessed using a service token with the\n`content:search` scope. When accessed with a service token, all\ncontent items are returned without user-based access filtering.\nThe `owner` and `bookmarked` query filters and the `bookmarked`\nand `schedule` include options are not available with service tokens.\n\n#### Search query\n\nThe search query is a string that includes both search terms and\nfilters. Any text in the search query that is not a supported filter\nis treated as a search term, and those search terms are matched\nagainst any of: `name`, `title`, or `description`. Note that the search\nterms are case-insensitive, and all terms must be present in a content\nitem for it to be included in the search results.\n\nWithin a single search term, any run of non-alphanumeric separator\ncharacters — whitespace, dashes, underscores, dots, slashes, colons,\npipes, and plus signs (including Unicode variants such as the en dash,\nem dash, no-break space, etc.) — are treated as\ninterchangeable. For example, a query for `sales-report` will match\ncontent named `sales-report`, `sales_report`, `sales.report`, or\n`sales report`. Letters and digits are matched literally.\n\n##### Filters\n\nFilters are specified as colon-delimited key-value pairs, containing one\nor more values separated by commas. If any of the values within a filter\ncontain a space or comma, you should use quotes around the value. Example:\n\n```\nmyterm tag:tagwithoutspace,\"tag with space\"\n```\n\nValues may contain other punctuation literally, including `\"`, `\\`, and\n`/`. The escape sequences `\\\"` and `\\\\` always produce a literal `\"` and\n`\\` respectively; any other backslash is preserved as-is, so tag names\nlike `back\\slash` work without escaping. To match a tag whose name begins\nwith `\"`, escape the leading quote: `tag:\\\"my-tag`. If a value contains a\nspace it must be wrapped in quotes, and any interior quotes are escaped;\nfor example, the tag named `\"quoted tag\"` is matched with\n`tag:\"\\\"quoted tag\\\"\"`.\n\nFor filters that expect a boolean value (like `published:`, `locked:`,\nand `bookmarked:`), you can use the shorthand `is:<field>` as an\nequivalent to `<field>:true`. Similarly, you can use `not:<field>` as an\nequivalent to `<field>:false`. Examples:\n\n```\nis:published\n```\n\n```\nnot:locked\n```\n\n```\nis:bookmarked\n```\n\nAdditionally, you can negate a filter or search term by prefixing it\nwith a `-`. For example, `-owner:@me` will exclude content items\nowned by the requesting user.\n\nThe following filters are supported:\n\n`owner:<username>[,<additional-usernames>,...]`: Only return content\nitems that have the specified owner by username. If more than one\nusername is provided, content items owned by ANY of the specified owners\nwill be included. Note that usernames are not case sensitive.\n\n`type:<content-type>[,<additional-content-types>,...]`: Only return\ncontent items that have the specified content type. If more than one\ntype is provided, content items with ANY of the specified types will be\nincluded. See `app_mode` for a list of supported types and their\ndescription.\n\n`tag:<tag-name>[,<additional-tag-names>,...]`: Only return content\nitems that have been tagged with the specified tag name. If more than\none tag name is provided, content items with *any* of the specified tag\nnames are included. Additionally, since tags are hierarchical, they\ndo not necessarily have unique names. For example, you may have one\n`docs` tag that is nested under a `finance` tag, and a separate `docs`\ntag that is nested under an `engineering` tag. If you specify\n`tag:docs`, it will match content items with either of those `docs`\ntags. If you want a specific tag, you can specify the path to the tag,\ndelimited by `/`. In this case, `tag:finance/docs` would only match the\n`docs` tag that is nested directly under the `finance` tag.\n\n`published:<true|false>` - Only return content items that have been\npublished, which means that a bundle has been uploaded for the content\nitem.\n\n`locked:<true|false>` - Only return content items that have been locked.\n\n`bookmarked:<true|false>` - Only return content items that have been\nbookmarked by the requesting user.\n\n`scheduled:<true|false>` - Only return content items that have been\nscheduled to run on a recurring basis.\n\n`python:<version>` - Only return content items that use a specific Python\nversion in their runtime environment. The version can be specified as\n`3`, `3.11`, or `3.11.5`. You can find content items that use\nany version of Python by specifying `is:python`.\n\n`r:<version>` - Only return content items that use a specific R\nversion in their runtime environment. The version can be specified as\n`4`, `4.3`, or `4.3.1`. You can find content items that use\nany version of R by specifying `is:r`.\n\n`package:<name>[version]` - Only return content items that have a\nspecific package in their runtime environment. If a version specification\nis provided, only return content items that have a matching\nversion for the package. Examples:\n\n- `flask`: Return items that include the `flask` package.\n- `flask==2.3.4`: Return items that include `flask` version `2.3.4`. Versions\n  ending in `.0` are equivalent to versions without the `.0`.\n- `flask==2.3.*`: Return items that include any `flask` version starting with `2.3`.\n- `flask>=2.3`: Return items that include `flask` version `2.3` or newer.\n- Similarly, you can use `<=`, `<`, `>`, and `!=`. You can combine criteria\n  with commas, such as `\"flask>=2.3,<3\"`; those must be enclosed in double-quotes.\n  Alternatively, you can use the `package` filter multiple times:\n  `package:flask>=2.3 package:flask<3`.\n- `flask~=2.3.4`: Return items that include a  `flask` version compatible with `2.3.4`;\n  that is, a `2.3.x` version that is `>=2.3.4`.\n- `flask===2.3`: Return items that include a  `flask` version that exactly matches `2.3`.\n  Version `2.3.0` would not match this filter.\n\nNote that a content item may include packages that are not explicitly requested\nin the `manifest.json` or `requirements.txt` file used during deployment. These include\npackages that are:\n\n- Installed as dependencies of the explicitly requested packages,\n- Installed by Connect in order to render or serve the content item,\n- Installed in the base Python installation and inherited by the content item, or\n- Listed under [`R.External`](../admin/appendix/configuration/index.md#R.External) in the Connect configuration file.\n\n`image:<image_name>` - Only return content items that use a specific image in\ntheir execution environment. This filter performs partial string matching on the\nimage name in either the `image_name` or `default_image_name` content fields.\n\n#### Validation warnings\n\nWhen a filter value is invalid (for example, `published:bogus`\ninstead of `published:true`), the invalid filter is ignored and\nthe response includes a `warnings` array with messages explaining\nwhich filters were not applied and why. Results are returned as\nif the invalid filter was not specified.\n\n#### Pagination\n\nThis endpoint uses offset pagination. Requests can include\nquery-string parameters for `page_number` and `page_size` to\nfetch different pages of results."
      operationId: searchContent
      parameters:
      - in: query
        name: q
        schema:
          type: string
      - description: 'Comma-separated set of values indicating additional details to include in the response.


          * `tags`: Populates a `tags` field for each returned content item

          containing the tags associated with this content item.

          * `owner`: Populates an `owner` field for each returned content

          item with basic details about the content owner.

          * `vanity_url`: Populates the `vanity_url` field for each returned

          content item if the content has an associated custom vanity URL.

          * `bookmarked`: Populates a `bookmarked` field for each returned

          content item indicating whether the requesting user has bookmarked

          the content.

          * `schedule`: Populates a `schedules` field for each returned

          content item with the list of schedules associated with the

          content, including variant details and last run information.

          '
        in: query
        name: include
        schema:
          enum:
          - tags
          - owner
          - vanity_url
          - bookmarked
          - schedule
          type: string
      - description: The page number to return.
        in: query
        name: page_number
        schema:
          default: 1
          format: int64
          type: integer
      - description: The number of items per page.
        in: query
        name: page_size
        schema:
          default: 20
          format: int64
          type: integer
      - description: The field to sort by.
        in: query
        name: sort
        schema:
          type: string
      - description: 'The sort order: asc or desc.'
        in: query
        name: order
        schema:
          enum:
          - asc
          - desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResults'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Search for content items
      tags:
      - Content
  /v1/search/variants:
    get:
      description: "This endpoint searches for variants (report outputs).\nVariants are created when reports are rendered. A parameterized report\nmay have multiple variants when it is rendered with different parameter\nvalues.\n\nAuthenticated access is required. Administrators can see public\nvariants, and their own private variants, for all content, while other\nusers can only see variants for content they own or have permissions to\naccess.\n\n#### Variant visibility\n\nIn addition to content-level permissions, variants have their own\nvisibility settings:\n\n- **Public variants**: Visible to all users who can access the parent content\n- **Private variants**: Only visible to the variant owner, regardless of\n  content permissions\n\nADHOC variants (temporary renders) are never returned in search results.\n\n#### Pagination\n\nThis endpoint uses offset pagination. Requests can include\nquery-string parameters for `page_number` and `page_size` to\nfetch different pages of results."
      operationId: searchVariants
      parameters:
      - in: query
        name: q
        schema:
          type: string
      - description: The page number to return.
        in: query
        name: page_number
        schema:
          default: 1
          format: int64
          type: integer
      - description: The number of items per page.
        in: query
        name: page_size
        schema:
          default: 20
          format: int64
          type: integer
      - description: The field to sort by.
        in: query
        name: sort
        schema:
          type: string
      - description: 'The sort order: asc or desc.'
        in: query
        name: order
        schema:
          enum:
          - asc
          - desc
          type: string
      - description: 'A comma-separated list of additional information to include in the response.


          * `schedule`: Include schedule information for each variant, including

          the schedule configuration and last run details.'
        in: query
        name: include
        schema:
          enum:
          - schedule
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResults'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Search for variants
      tags:
      - Content
components:
  schemas:
    ContentDeploymentTask:
      additionalProperties: false
      description: Identifies the task that can be used to track the progress of a deployment operation.
      properties:
        task_id:
          description: Identifier for the created deployment task.
          example: M49MsuXt6XVzlRdL
          type: string
      type: object
    CreateContentInput:
      additionalProperties: false
      description: The content fields that can be specified when creating a content item.
      properties:
        name:
          description: 'A simple identifier. Allows alpha-numeric

            characters, periods (`"."`), hyphens (`"-"`), and underscores (`"_"`).'
          example: quarterly-analysis
          type: string
        title:
          description: The title of this content.
          example: Quarterly Analysis of Team Velocity
          nullable: true
          type: string
        description:
          description: A rich description of this content.
          example: This report calculates per-team statistics ...
          type: string
        access_type:
          description: 'Access type describes how this content manages its viewers. The

            value `all` is the most permissive; any visitor to Posit Connect

            will be able to view this content. The value `logged_in` indicates

            that all Posit Connect accounts may view the content. The `acl`

            value lets specifically enumerated users and groups view the

            content. Users configured as collaborators may always view content.


            Access types may be restricted by the Connect configuration or the

            product license.'
          enum:
          - all
          - logged_in
          - acl
          example: acl
          type: string
        connection_timeout:
          description: 'Maximum number of seconds allowed without data sent or received

            across a client connection. A value of `0` means connections will

            never time-out (not recommended). When `null`, the default

            [`Scheduler.ConnectionTimeout`](../admin/appendix/configuration/index.md#Scheduler.ConnectionTimeout) is used. Applies only to content types

            that are executed on demand.'
          example: 3600
          format: int32
          nullable: true
          type: integer
        read_timeout:
          description: 'Maximum number of seconds allowed without data received from a

            client connection. A value of `0` means a lack of client (browser)

            interaction never causes the connection to close. When `null`, the

            default [`Scheduler.ReadTimeout`](../admin/appendix/configuration/index.md#Scheduler.ReadTimeout) is used. Applies only to content

            types that are executed on demand.'
          example: 3600
          format: int32
          nullable: true
          type: integer
        init_timeout:
          description: 'The maximum number of seconds allowed for an interactive application

            to start. Posit Connect must be able to connect to a newly

            launched application before this threshold has

            elapsed. When `null`, the default [`Scheduler.InitTimeout`](../admin/appendix/configuration/index.md#Scheduler.InitTimeout) is used.

            Applies only to content types that are executed on demand.'
          example: 60
          format: int32
          nullable: true
          type: integer
        idle_timeout:
          description: 'The maximum number of seconds a worker process for an interactive

            application to remain alive after it goes idle (no active

            connections). When `null`, the default [`Scheduler.IdleTimeout`](../admin/appendix/configuration/index.md#Scheduler.IdleTimeout) is

            used. Applies only to content types that are executed on demand.'
          example: 5
          format: int32
          nullable: true
          type: integer
        max_processes:
          description: 'Specifies the total number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default [`Scheduler.MaxProcesses`](../admin/appendix/configuration/index.md#Scheduler.MaxProcesses) is used. Applies only to

            content types that are executed on demand.'
          example: 3
          format: int32
          nullable: true
          type: integer
        min_processes:
          description: 'Specifies the minimum number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default `Scheduler.MinProcesses` is used. Applies only to

            content types that are executed on demand.'
          example: 0
          format: int32
          nullable: true
          type: integer
        max_conns_per_process:
          description: 'Specifies the maximum number of client connections allowed to an

            individual process. Incoming connections which will exceed this

            limit are routed to a new process or rejected. When `null`, the

            default [`Scheduler.MaxConnsPerProcess`](../admin/appendix/configuration/index.md#Scheduler.MaxConnsPerProcess) is used. Applies only to

            content types that are executed on demand.'
          example: 20
          format: int32
          nullable: true
          type: integer
        load_factor:
          description: 'Controls how aggressively new processes are spawned. When `null`,

            the default [`Scheduler.LoadFactor`](../admin/appendix/configuration/index.md#Scheduler.LoadFactor) is used. Applies only to content

            types that are executed on demand.'
          example: 0.5
          format: double
          nullable: true
          type: number
        default_r_environment_management:
          description: 'Indicates whether or not Connect should create and manage an R

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.'
          example: true
          nullable: true
          type: boolean
        default_py_environment_management:
          description: 'Indicates whether or not Connect should create and manage a Python

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.'
          example: true
          nullable: true
          type: boolean
        run_as:
          description: 'The UNIX user that executes this content. When `null`, the default

            [`Applications.RunAs`](../admin/appendix/configuration/index.md#Applications.RunAs) is used. Applies only to executable content

            types - not `static`.'
          example: rstudio-connect
          nullable: true
          type: string
        run_as_current_user:
          description: 'Indicates that Connect should run processes for this content item

            under the Unix account of the user who visits it. Content accessed

            anonymously will continue to run as the specified `run_as` user.'
          example: false
          nullable: true
          type: boolean
        memory_request:
          description: 'The minimum amount of RAM this content needs when executing or

            rendering, expressed in bytes. When `null`, the default

            [`Scheduler.MemoryRequest`](../admin/appendix/configuration/index.md#Scheduler.MemoryRequest) is used.'
          example: 1073741824
          format: int64
          nullable: true
          type: integer
        memory_limit:
          description: 'The maximum amount of RAM this content will be allowed to consume

            when executing or rendering, expressed in bytes. When `null`, the

            default [`Scheduler.MemoryLimit`](../admin/appendix/configuration/index.md#Scheduler.MemoryLimit) is used.'
          example: 2147483648
          format: int64
          nullable: true
          type: integer
        cpu_request:
          description: 'The minimum amount of compute power this content needs when executing

            or rendering, expressed in CPU Units, where 1.0 unit is equivalent to

            1 physical or virtual core. Fractional values are allowed. When `null`,

            the default [`Scheduler.CPURequest`](../admin/appendix/configuration/index.md#Scheduler.CPURequest) is used.'
          example: 1
          format: double
          nullable: true
          type: number
        cpu_limit:
          description: 'The maximum amount of compute power this content will be allowed to

            consume when executing or rendering, expressed in CPU Units. When

            `null`, the default [`Scheduler.CPULimit`](../admin/appendix/configuration/index.md#Scheduler.CPULimit) is used.'
          example: 1.5
          format: double
          nullable: true
          type: number
        amd_gpu_limit:
          description: 'The number of AMD GPUs allocated to run this content. When `null`,

            the default [`Scheduler.AMDGPULimit`](../admin/appendix/configuration/index.md#Scheduler.AMDGPULimit) is used.'
          example: 1
          format: int64
          nullable: true
          type: integer
        nvidia_gpu_limit:
          description: 'The number of NVIDIA GPUs allocated to run this content. When `null`,

            the default [`Scheduler.NvidiaGPULimit`](../admin/appendix/configuration/index.md#Scheduler.NvidiaGPULimit) is used.'
          example: 1
          format: int64
          nullable: true
          type: integer
        service_account_name:
          description: The name of the Kubernetes service account used to run this content.
          example: rstudio-connect-content
          nullable: true
          type: string
        default_image_name:
          description: 'The default container image used when none is defined by the bundle''s

            manifest.'
          example: rstudio/content-base:r4.1.3-py3.10.11-jammy
          nullable: true
          type: string
        default_environment_guid:
          description: 'The default execution environment used when none is defined by the

            bundle''s manifest.'
          example: 36538b83-ea6d-4839-ae8e-53c52ac5f0bf
          format: uuid
          nullable: true
          type: string
        metrics_collection_enabled:
          description: 'Controls whether per-job resource metrics are collected for this

            content item. When `null`, inherits the server-wide default.'
          example: true
          nullable: true
          type: boolean
        notify_on_share:
          description: 'Controls whether email notifications are sent by default when

            users or groups are added as collaborators or viewers.

            When `null`, inherits the server-wide default from

            [`Applications.NotifyOnShare`](../admin/appendix/configuration/index.md#Applications.NotifyOnShare).'
          example: true
          nullable: true
          type: boolean
        otel_enabled:
          description: Controls whether content telemetry is collected for this content item.
          example: false
          nullable: true
          type: boolean
      type: object
    OAuthIntegrationAssociationOutput:
      additionalProperties: false
      description: Represents an association between a content item and an OAuth integration.
      properties:
        app_guid:
          description: This field is deprecated and has been renamed to `content_guid`.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        content_guid:
          description: The unique identifier of the content item.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f

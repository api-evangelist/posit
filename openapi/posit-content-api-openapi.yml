  /v1/search/content:
    get:
      description: 'This endpoint searches for content items, using a search query format

        that allows for both search terms and filters.'
      operationId: searchContent
      parameters:
      - in: query
        name: q
        schema:
          type: string
      - description: 'Comma-separated set of values indicating additional details to include in the response.


          * `tags`: Populates a `tags` field for each returned content item

          containing the tags associated with this content item.

          * `owner`: Populates an `owner` field for each returned content

          item with basic details about the content owner.

          * `vanity_url`: Populates the `vanity_url` field for each returned

          content item if the content has an associated custom vanity URL.

          * `bookmarked`: Populates a `bookmarked` field for each returned

          content item indicating whether the requesting user has bookmarked

          the content.

          * `schedule`: Populates a `schedules` field for each returned

          content item with the list of schedules associated with the

          content, including variant details and last run information.

          '
        in: query
        name: include
        schema:
          enum:
          - tags
          - owner
          - vanity_url
          - bookmarked
          - schedule
          type: string
      - description: The page number to return.
        in: query
        name: page_number
        schema:
          default: 1
          format: int64
          type: integer
      - description: The number of items per page.
        in: query
        name: page_size
        schema:
          default: 20
          format: int64
          type: integer
      - description: The field to sort by.
        in: query
        name: sort
        schema:
          type: string
      - description: 'The sort order: asc or desc.'
        in: query
        name: order
        schema:
          enum:
          - asc
          - desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResults'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Search for content items
      tags:
      - Content
  /v1/search/variants:
    get:
      description: 'This endpoint searches for variants (report outputs).

        Variants are created when reports are rendered. A parameterized report

        may have multiple variants when it is rendered with different parameter

        values.


        Authenticated access is required. Administrators can see public

        variants, and their own private variants, for all content, while other

        users can only see variants for content they own or have permissions to

        access.


        #### Variant visibility


        In addition to content-level permissions, variants have their own

        visibility settings:


        - **Public variants**: Visible to all users who can access the parent content

        - **Private variants**: Only visible to the variant owner, regardless of

        content permissions


        ADHOC variants (temporary renders) are never returned in search results.


        #### Pagination


        This endpoint uses offset pagination. Requests can include

        query-string parameters for `page_number` and `page_size` to

        fetch different pages of results.'
      operationId: searchVariants
      parameters:
      - in: query
        name: q
        schema:
          type: string
      - description: The page number to return.
        in: query
        name: page_number
        schema:
          default: 1
          format: int64
          type: integer
      - description: The number of items per page.
        in: query
        name: page_size
        schema:
          default: 20
          format: int64
          type: integer
      - description: The field to sort by.
        in: query
        name: sort
        schema:
          type: string
      - description: 'The sort order: asc or desc.'
        in: query
        name: order
        schema:
          enum:
          - asc
          - desc
          type: string
      - description: 'A comma-separated list of additional information to include in the response.


          * `schedule`: Include schedule information for each variant, including

          the schedule configuration and last run details.'
        in: query
        name: include
        schema:
          enum:
          - schedule
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResults'
          description: Successful response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: The requested operation requires authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: You do not have permission to perform this operation.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: A server error occurred.
      summary: Search for variants
      tags:
      - Content
components:
  schemas:
    OffsetPaging:
      description: Offset-based pagination metadata.
      properties:
        current_page:
          description: The current page of results
          example: 1
          format: int32
          type: integer
        total:
          description: The number of items that match the given filters
          example: 1
          format: int32
          type: integer
      type: object
    UpdateContentInput:
      additionalProperties: false
      description: The content fields that can be specified when updating a content item.
      properties:
        name:
          description: 'A simple identifier. Allows alpha-numeric

            characters, periods (`"."`), hyphens (`"-"`), and underscores (`"_"`).'
          example: quarterly-analysis
          type: string
        title:
          description: The title of this content.
          example: Quarterly Analysis of Team Velocity
          type:
          - string
          - 'null'
        description:
          description: A rich description of this content.
          example: This report calculates per-team statistics ...
          type: string
        owner_guid:
          description: 'The unique identifier of the user who owns this content item.

            Can only be changed by an administrator.'
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type:
          - string
          - 'null'
        access_type:
          description: 'Access type describes how this content manages its viewers. The

            value `all` is the most permissive; any visitor to Posit Connect

            will be able to view this content. The value `logged_in` indicates

            that all Posit Connect accounts may view the content. The `acl`

            value lets specifically enumerated users and groups view the

            content. Users configured as collaborators may always view content.


            Access types may be restricted by the Connect configuration or the

            product license.'
          enum:
          - all
          - logged_in
          - acl
          example: acl
          type: string
        locked:
          description: Whether or not the content is locked.
          example: false
          type:
          - boolean
          - 'null'
        locked_message:
          description: 'A custom message that is displayed by the content item when locked.

            It is possible to format this message using Markdown.'
          example: '# This piece of content is locked'
          type:
          - string
          - 'null'
        connection_timeout:
          description: 'Maximum number of seconds allowed without data sent or received

            across a client connection. A value of `0` means connections will

            never time-out (not recommended). When `null`, the default

            [`Scheduler.ConnectionTimeout`](../admin/appendix/configuration/index.md#Scheduler.ConnectionTimeout) is used. Applies only to content types

            that are executed on demand.'
          example: 3600
          format: int32
          type:
          - integer
          - 'null'
        read_timeout:
          description: 'Maximum number of seconds allowed without data received from a

            client connection. A value of `0` means a lack of client (browser)

            interaction never causes the connection to close. When `null`, the

            default [`Scheduler.ReadTimeout`](../admin/appendix/configuration/index.md#Scheduler.ReadTimeout) is used. Applies only to content

            types that are executed on demand.'
          example: 3600
          format: int32
          type:
          - integer
          - 'null'
        init_timeout:
          description: 'The maximum number of seconds allowed for an interactive application

            to start. Posit Connect must be able to connect to a newly

            launched application before this threshold has

            elapsed. When `null`, the default [`Scheduler.InitTimeout`](../admin/appendix/configuration/index.md#Scheduler.InitTimeout) is used.

            Applies only to content types that are executed on demand.'
          example: 60
          format: int32
          type:
          - integer
          - 'null'
        idle_timeout:
          description: 'The maximum number of seconds a worker process for an interactive

            application to remain alive after it goes idle (no active

            connections). When `null`, the default [`Scheduler.IdleTimeout`](../admin/appendix/configuration/index.md#Scheduler.IdleTimeout) is

            used. Applies only to content types that are executed on demand.'
          example: 5
          format: int32
          type:
          - integer
          - 'null'
        max_processes:
          description: 'Specifies the total number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default [`Scheduler.MaxProcesses`](../admin/appendix/configuration/index.md#Scheduler.MaxProcesses) is used. Applies only to

            content types that are executed on demand.'
          example: 3
          format: int32
          type:
          - integer
          - 'null'
        min_processes:
          description: 'Specifies the minimum number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default `Scheduler.MinProcesses` is used. Applies only to

            content types that are executed on demand.'
          example: 0
          format: int32
          type:
          - integer
          - 'null'
        max_conns_per_process:
          description: 'Specifies the maximum number of client connections allowed to an

            individual process. Incoming connections which will exceed this

            limit are routed to a new process or rejected. When `null`, the

            default [`Scheduler.MaxConnsPerProcess`](../admin/appendix/configuration/index.md#Scheduler.MaxConnsPerProcess) is used. Applies only to

            content types that are executed on demand.'
          example: 20
          format: int32
          type:
          - integer
          - 'null'
        load_factor:
          description: 'Controls how aggressively new processes are spawned. When `null`,

            the default [`Scheduler.LoadFactor`](../admin/appendix/configuration/index.md#Scheduler.LoadFactor) is used. Applies only to content

            types that are executed on demand.'
          example: 0.5
          format: double
          type:
          - number
          - 'null'
        default_r_environment_management:
          description: 'Indicates whether or not Connect should create and manage an R

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.'
          example: true
          type:
          - boolean
          - 'null'
        default_py_environment_management:
          description: 'Indicates whether or not Connect should create and manage a Python

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.'
          example: true
          type:
          - boolean
          - 'null'
        run_as:
          description: 'The UNIX user that executes this content. When `null`, the default

            [`Applications.RunAs`](../admin/appendix/configuration/index.md#Applications.RunAs) is used. Applies only to executable content

            types - not `static`.'
          example: rstudio-connect
          type:
          - string
          - 'null'
        run_as_current_user:
          description: 'Indicates that Connect should run processes for this content item

            under the Unix account of the user who visits it. Content accessed

            anonymously will continue to run as the specified `run_as` user.'
          example: false
          type:
          - boolean
          - 'null'
        memory_request:
          description: 'The minimum amount of RAM this content needs when executing or

            rendering, expressed in bytes. When `null`, the default

            [`Scheduler.MemoryRequest`](../admin/appendix/configuration/index.md#Scheduler.MemoryRequest) is used.'
          example: 1073741824
          format: int64
          type:
          - integer
          - 'null'
        memory_limit:
          description: 'The maximum amount of RAM this content will be allowed to consume

            when executing or rendering, expressed in bytes. When `null`, the

            default [`Scheduler.MemoryLimit`](../admin/appendix/configuration/index.md#Scheduler.MemoryLimit) is used.'
          example: 2147483648
          format: int64
          type:
          - integer
          - 'null'
        cpu_request:
          description: 'The minimum amount of compute power this content needs when executing

            or rendering, expressed in CPU Units, where 1.0 unit is equivalent to

            1 physical or virtual core. Fractional values are allowed. When `null`,

            the default [`Scheduler.CPURequest`](../admin/appendix/configuration/index.md#Scheduler.CPURequest) is used.'
          example: 1
          format: double
          type:
          - number
          - 'null'
        cpu_limit:
          description: 'The maximum amount of compute power this content will be allowed to

            consume when executing or rendering, expressed in CPU Units. When

            `null`, the default [`Scheduler.CPULimit`](../admin/appendix/configuration/index.md#Scheduler.CPULimit) is used.'
          example: 1.5
          format: double
          type:
          - number
          - 'null'
        amd_gpu_limit:
          description: 'The number of AMD GPUs allocated to run this content. When `null`,

            the default [`Scheduler.AMDGPULimit`](../admin/appendix/configuration/index.md#Scheduler.AMDGPULimit) is used.'
          example: 1
          format: int64
          type:
          - integer
          - 'null'
        nvidia_gpu_limit:
          description: 'The number of NVIDIA GPUs allocated to run this content. When `null`,

            the default [`Scheduler.NvidiaGPULimit`](../admin/appendix/configuration/index.md#Scheduler.NvidiaGPULimit) is used.'
          example: 1
          format: int64
          type:
          - integer
          - 'null'
        service_account_name:
          description: The name of the Kubernetes service account used to run this content.
          example: rstudio-connect-content
          type:
          - string
          - 'null'
        default_image_name:
          description: 'The default container image used when none is defined by the bundle''s

            manifest.'
          example: rstudio/content-base:r4.1.3-py3.10.11-jammy
          type:
          - string
          - 'null'
        default_environment_guid:
          description: 'The default execution environment used when none is defined by the

            bundle''s manifest.'
          example: 36538b83-ea6d-4839-ae8e-53c52ac5f0bf
          format: uuid
          type:
          - string
          - 'null'
        metrics_collection_enabled:
          description: 'Controls whether per-job resource metrics are collected for this

            content item. When `null`, inherits the server-wide default.'
          example: true
          type:
          - boolean
          - 'null'
        notify_on_share:
          description: 'Controls whether email notifications are sent by default when

            users or groups are added as collaborators or viewers.

            When `null`, inherits the server-wide default from

            [`Applications.NotifyOnShare`](../admin/appendix/configuration/index.md#Applications.NotifyOnShare).'
          example: true
          type:
          - boolean
          - 'null'
        otel_enabled:
          description: Controls whether content telemetry is collected for this content item.
          example: false
          type:
          - boolean
          - 'null'
        content_category:
          description: 'The `content_category` field refines the type of content specified by

            `app_mode`. For example, the MCP content category indicates content that

            serves as an MCP server. Allowed values are `""` (empty string to clear)

            or `"mcp"`.'
          example: mcp
          type:
          - string
          - 'null'
      type: object
    GitLocationInput:
      additionalProperties: false
      description: Git location associated with a content item.
      properties:
        repository:
          description: URL for the repository.
          example: https://github.com/rstudio/connect-examples
          type: string
        branch:
          description: The tracked Git branch.
          example: main
          type: string
        directory:
          description: Directory containing the content.
          example: stock-report
          type: string
        polling:
          description: Indicates that the Git repository should be regularly polled.
          example: false
          type: boolean
      type: object
    OAuthIntegrationAssociationInput:
      additionalProperties: false
      description: An OAuth integration GUID to associate with a content item.
      properties:
        oauth_integration_guid:
          description: The unique identifier of an existing OAuth integration.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
      type: object
    ContentDeploymentInstructions:
      additionalProperties: false
      description: Optionally identifies the target deployment bundle.
      properties:
        bundle_id:
          description: The identifier of the bundle to deploy. If not provided, the most recently uploaded bundle is deployed.
          type:
          - string
          - 'null'
        activate:
          description: Whether the deployed bundle should be activated after deployment. Defaults to true.
          type:
          - boolean
          - 'null'
      type: object
    VariantResults:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            description: The list of variants, paginated
            items:
              $ref: '#/components/schemas/VariantSearchResult'
            type: array
        type: object
      description: Search results containing variants and pagination metadata.
    GitLocationOutput:
      additionalProperties: false
      description: Git location associated with a content item.
      properties:
        repository:
          description: URL for the repository.
          example: https://github.com/rstudio/connect-examples
          type: string
        branch:
          description: The tracked Git branch.
          example: main
          type: string
        directory:
          description: Directory containing the content.
          example: stock-report
          type: string
        polling:
          description: Indicates that the Git repository is regularly polled.
          example: false
          type: boolean
        last_error:
          description: The last error encountered when polling the Git repository, if one occurred.
          example: The requested operation requires authentication.
          type: string
        last_known_commit:
          description: The last known commit in the Git repository.
          example: a8906feae5c7675b934b7d22eb5fbd12ce51f1ba
          type: string
        last_fetched_time:
          description: The last time the Git repository was fetched.
          example: '2026-04-14T12:00:00Z'
          format: date-time
          type: string
      type: object
    Package:
      additionalProperties: false
      description: A package dependency record.
      properties:
        language:
          description: Language ecosystem the package belongs to
          type: string
        language_version:
          description: Version of R or Python used by the content
          example: 3.12.4
          type: string
        name:
          description: Package name
          example: shiny
          type: string
        version:
          description: Package version
          example: 1.0.3
          type: string
        hash:
          description: Package description hash for R packages
          example: e4ac73dd20b2f6420742aac66e5d3e78
          type:
          - string
          - 'null'
        bundle_id:
          description: Identifier for the bundle that depends on this package
          example: '449'
          type: string
        app_id:
          description: This field is deprecated and has been renamed to `content_id`.
          example: '145'
          type: string
        app_guid:
          description: This field is deprecated and has been renamed to `content_guid`.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        content_id:
          description: Numeric identifier for the content that depends on this package
          example: '145'
          type: string
        content_guid:
          description: The unique identifier of the content item that depends on this package
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
      type: object
    ScheduleVariant:
      additionalProperties: false
      description: Variant information embedded in a schedule.
      properties:
        key:
          description: The variant key.
          example: default
          type: string
        name:
          description: The variant name.
          example: Default Variant
          type: string
        is_default:
          description: Whether this is the default variant.
          example: true
          type: boolean
      type: object
    ScheduleLastRun:
      additionalProperties: false
      description: Information about the last scheduled run.
      properties:
        job_key:
          description: The unique key of the job.
          example: abc123xyz
          type: string
        status:
          description: The status of the last run.
          example: success
          type: string
        scheduled_time:
          description: The scheduled time of the run.
          format: date-time
          type:
          - string
          - 'null'
        queued_time:
          description: The time the run was queued.
          format: date-time
          type:
          - string
          - 'null'
        start_time:
          description: The time the run started.
          format: date-time
          type: string
        end_time:
          description: The time the run ended. Null if still running.
          format: date-time
          type:
          - string
          - 'null'
        run_duration_ms:
          description: The duration of the run in milliseconds. Null if still running.
          example: 5000
          format: int64
          type:
          - integer
          - 'null'
        exit_code:
          description: The exit code of the job. Null if still running.
          example: 0
          format: int64
          type:
          - integer
          - 'null'
      type: object
    APIError:
      additionalProperties: false
      description: The error object returned by the API on failure.
      properties:
        code:
          description: The specific code for the type of error returned. See the [API error codes reference](#api-error-codes) for the full set of values.
          type: integer
        error:
          description: A description of the problem that was encountered.
          type: string
        payload:
          description: Additional error details, if any. The structure varies by error type.
          type:
          - object
          - 'null'
      required:
      - code
      - error
      type: object
    RRuleSet:
      additionalProperties: false
      description: RFC 5545 recurrence rule components for a schedule.
      properties:
        dtstart:
          description: 'The DTSTART component specifying when the schedule begins,

            including timezone information.'
          example: DTSTART;TZID=America/New_York:20240115T090000
          type: string
        rrules:
          description: An array of RRULE components defining the recurrence pattern.
          example:
          - RRULE:FREQ=DAILY;INTERVAL=2
          items:
            type: string
          type: array
        until:
          description: The UNTIL component specifying when the schedule ends, if applicable.
          example: UNTIL=20240215T090000Z
          type: string
      type: object
    VariantSearchResult:
      additionalProperties: false
      description: A single variant in search results.
      properties:
        content_guid:
          description: The GUID of the parent content item
          example: abc123de-f456-7890-abcd-ef1234567890
          format: uuid
          type: string
        content_name:
          description: The URL-friendly name of the parent content item
          example: monthly-sales-report
          type: string
        content_title:
          description: The human-readable title of the parent content item
          example: Monthly Sales Report
          type:
          - string
          - 'null'
        variant_key:
          description: The unique key identifying this variant
          example: xyz789
          type: string
        variant_name:
          description: The human-readable name of the variant
          example: West Region
          type: string
        is_default:
          description: Whether this is the default variant for the content
          example: false
          type: boolean
        created_time:
          description: The time this variant was created
          example: '2025-06-15T09:00:00Z'
          format: date-time
          type: string
        render_time:
          description: The time this variant was last rendered
          example: '2026-01-26T08:00:00Z'
          format: date-time
          type:
          - string
          - 'null'
        failures:
          description: 'The number of failed jobs (non-zero exit code) for this variant.

            When a `failed:>=` filter is used, this count is scoped to failures

            on or after the given timestamp.'
          example: 0
          type: integer
        last_failed:
          description: 'The time the most recent failed job completed for this variant.

            Null if no failures have occurred. When a `failed:>=` filter is

            used, this reflects only failures within the given time window.'
          example: '2026-02-01T12:00:00Z'
          format: date-time
          type:
          - string
          - 'null'
        skips:
          description: 'The number of skipped scheduled jobs for this variant. When a

            `skipped:>=` filter is used, this count is scoped to skips on or

            after the given timestamp.'
          example: 0
          type: integer
        last_skipped:
          description: 'The scheduled time of the most recent skipped job for this

            variant. Null if no skips have occurred. When a `skipped:>=`

            filter is used, this reflects only skips within the given time

            window.'
          example: '2026-02-01T12:00:00Z'
          format: date-time
          type:
          - string
          - 'null'
        schedule:
          allOf:
          - $ref: '#/components/schemas/Schedule'
          description: Schedule information for this variant. Omitted if no schedule exists.
      type: object
    ContentRenderTask:
      additionalProperties: false
      description: The result of requesting a content render, containing a task identifier.
      properties:
        task_id:
          description: Identifier for the created render task.
          example: M49MsuXt6XVzlRdL
          type: string
      type: object
    EnvironmentVariables:
      description: List of environment variables with their values.
      items:
        $ref: '#/components/schemas/EnvironmentVariable'
      type: array
    ContentResults:
      allOf:
      - $ref: '#/components/schemas/OffsetPaging'
      - properties:
          results:
            description: The list of content items, paginated
            items:
              $ref: '#/components/schemas/Content'
            type: array
          warnings:
            description: 'An optional list of warning messages generated during query

              processing. Warnings indicate issues with the search query that

              did not prevent the search from completing, such as invalid

              filter values. When a filter value is invalid, the filter is

              ignored and results are returned unfiltered for that field.

              This field is omitted when there are no warnings.'
            example:
            - 'Invalid value for ''published'' filter: ''bogus''. Expected true or false'
            items:
              type: string
            type: array
        type: object
      description: Search results containing content items and pagination metadata.
    ContentBuildInstructions:
      additionalProperties: false
      description: Optionally identifies the target build bundle.
      properties:
        bundle_id:
          description: The identifier of the bundle to build. If not provided, the most recently uploaded bundle is built.
          type:
          - string
          - 'null'
        activate:
          description: Whether the built bundle should be activated after building. Defaults to true.
          type:
          - boolean
          - 'null'
      type: object
    Content:
      additionalProperties: false
      description: The content object models all the "things" you may deploy to Posit Connect. This includes Shiny applications, R Markdown documents, Jupyter notebooks, Plumber APIs, FastAPI and Flask APIs, Python apps, plots, and pins.
      properties:
        guid:
          description: The unique identifier of this content item.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        name:
          description: 'A simple identifier. Allows alpha-numeric

            characters, periods (`"."`), hyphens (`"-"`), and underscores (`"_"`).'
          example: quarterly-analysis
          type: string
        title:
          description: The title of this content.
          example: Quarterly Analysis of Team Velocity
          type:
          - string
          - 'null'
        description:
          description: A rich description of this content.
          example: This report calculates per-team statistics ...
          type: string
        access_type:
          description: 'Access type describes how this content manages its viewers. The

            value `all` is the most permissive; any visitor to Posit Connect

            will be able to view this content. The value `logged_in` indicates

            that all Posit Connect accounts may view the content. The `acl`

            value lets specifically enumerated users and groups view the

            content. Users configured as collaborators may always view content.


            Access types may be restricted by the Connect configuration or the

            product license.'
          example: acl
          type: string
        locked:
          description: Whether or not the content is locked.
          example: false
          type: boolean
        locked_message:
          description: 'A custom message that is displayed by the content item when locked.

            It is possible to format this message using Markdown.'
          example: '# This piece of content is locked'
          type: string
        connection_timeout:
          description: 'Maximum number of seconds allowed without data sent or received

            across a client connection. A value of `0` means connections will

            never time-out (not recommended). When `null`, the default

            [`Scheduler.ConnectionTimeout`](../admin/appendix/configuration/index.md#Scheduler.ConnectionTimeout) is used. Applies only to content types

            that are executed on demand.'
          example: 3600
          format: int32
          type:
          - integer
          - 'null'
        read_timeout:
          description: 'Maximum number of seconds allowed without data received from a

            client connection. A value of `0` means a lack of client (browser)

            interaction never causes the connection to close. When `null`, the

            default [`Scheduler.ReadTimeout`](../admin/appendix/configuration/index.md#Scheduler.ReadTimeout) is used. Applies only to content

            types that are executed on demand.'
          example: 3600
          format: int32
          type:
          - integer
          - 'null'
        init_timeout:
          description: 'The maximum number of seconds allowed for an interactive application

            to start. Posit Connect must be able to connect to a newly

            launched application before this threshold has

            elapsed. When `null`, the default [`Scheduler.InitTimeout`](../admin/appendix/configuration/index.md#Scheduler.InitTimeout) is used.

            Applies only to content types that are executed on demand.'
          example: 60
          format: int32
          type:
          - integer
          - 'null'
        idle_timeout:
          description: 'The maximum number of seconds a worker process for an interactive

            application to remain alive after it goes idle (no active

            connections). When `null`, the default [`Scheduler.IdleTimeout`](../admin/appendix/configuration/index.md#Scheduler.IdleTimeout) is

            used. Applies only to content types that are executed on demand.'
          example: 5
          format: int32
          type:
          - integer
          - 'null'
        max_processes:
          description: 'Specifies the total number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default [`Scheduler.MaxProcesses`](../admin/appendix/configuration/index.md#Scheduler.MaxProcesses) is used. Applies only to

            content types that are executed on demand.'
          example: 3
          format: int32
          type:
          - integer
          - 'null'
        min_processes:
          description: 'Specifies the minimum number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default `Scheduler.MinProcesses` is used. Applies only to

            content types that are executed on demand.'
          example: 0
          format: int32
          type:
          - integer
          - 'null'
        max_conns_per_process:
          description: 'Specifies the maximum number of client connections allowed to an

            individual process. Incoming connections which will exceed this

            limit are routed to a new process or rejected. When `null`, the

            default [`Scheduler.MaxConnsPerProcess`](../admin/appendix/configuration/index.md#Scheduler.MaxConnsPerProcess) is used. Applies only to

            content types that are executed on demand.'
          example: 20
          format: int32
          type:
          - integer
          - 'null'
        load_factor:
          description: 'Controls how aggressively new processes are spawned. When `null`,

            the default [`Scheduler.LoadFactor`](../admin/appendix/configuration/index.md#Scheduler.LoadFactor) is used. Applies only to content

            types that are executed on demand.'
          example: 0.5
          format: double
          type:
          - number
          - 'null'
        memory_request:
          description: 'The minimum amount of RAM this content needs when executing or

            rendering, expressed in bytes. This is used when running in an

            off-host execution configuration to determine where the content

            should be run. When `null`, the default [`Scheduler.MemoryRequest`](../admin/appendix/configuration/index.md#Scheduler.MemoryRequest) is

            used.'
          example: 1073741824
          format: int64
          type:
          - integer
          - 'null'
        memory_limit:
          description: 'The maximum amount of RAM this content will be allowed to consume

            when executing or rendering, expressed in bytes. If the process tries

            to use more memory than allowed, it will be terminated. When `null`,

            the default [`Scheduler.MemoryLimit`](../admin/appendix/configuration/index.md#Scheduler.MemoryLimit) is used.'
          example: 2147483648
          format: int64
          type:
          - integer
          - 'null'
        cpu_request:
          description: 'The minimum amount of compute power this content needs when executing

            or rendering, expressed in ["CPU

            Units"](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#meaning-of-cpu),

            where 1.0 unit is equivalent to 1 physical or virtual core.

            Fractional values are allowed. This is used when running in an

            off-host execution configuration to determine where the content

            should be run. When `null`, the default [`Scheduler.CPURequest`](../admin/appendix/configuration/index.md#Scheduler.CPURequest) is

            used.'
          example: 1
          format: double
          type:
          - number
          - 'null'
        cpu_limit:
          description: 'The maximum amount of compute power this content will be allowed to

            consume when executing or rendering, expressed in ["CPU

            Units"](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#meaning-of-cpu),

            where 1.0 unit is equivalent to 1 physical or virtual core.

            Fractional values are allowed. This is used when running in an

            off-host execution configuration. If the process tries to use more

            CPU than allowed, it will be throttled. When `null`, the default

            [`Scheduler.CPULimit`](../admin/appendix/configuration/index.md#Scheduler.CPULimit) is used.'
          example: 1.5
          format: double
          type:
          - number
          - 'null'
        amd_gpu_limit:
          description: 'The number of AMD GPUs that will be

            [allocated by

            Kubernetes](https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/)

            to run this content. This is used when running in an

            off-host execution configuration. When `null`, the default

            [`Scheduler.AMDGPULimit`](../admin/appendix/configuration/index.md#Scheduler.AMDGPULimit) is used. This setting can not exceed

            [`Scheduler.MaxAMDGPULimit`](../admin/appendix/configuration/index.md#Scheduler.MaxAMDGPULimit).'
          example: 1
          format: int64
          type:
          - integer
          - 'null'
        nvidia_gpu_limit:
          description: 'The number of NVIDIA GPUs that will be

            [allocated by

            Kubernetes](https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/)

            to run this content. This is used when running in an

            off-host execution configuration. When `null`, the default

            [`Scheduler.NvidiaGPULimit`](../admin/appendix/configuration/index.md#Scheduler.NvidiaGPULimit) is used. This setting can not exceed

            [`Scheduler.MaxNvidiaGPULimit`](../admin/appendix/configuration/index.md#Scheduler.MaxNvidiaGPULimit).'
          example: 1
          format: int64
          type:
          - integer
          - 'null'
        service_account_name:
          description: 'The name of the Kubernetes service account that is used to run a particular

            piece of content.

            It must adhere to valid Kubernetes service account naming rules.


            Connect must be configured to run with [`Launcher.Enabled = true`](../admin/appendix/configuration/index.md#Launcher.Enabled),

            [`Launcher.Kubernetes = true`](../admin/appendix/configuration/index.md#Launcher.Kubernetes) and

            [`Launcher.KubernetesContentServiceAccountSelection = true`](../admin/appendix/configuration/index.md#Launcher.KubernetesContentServiceAccountSelection)

            for this value to be applied. It will have precedence over the

            [`Launcher.KubernetesDefaultServiceAccount`](../admin/appendix/configuration/index.md#Launcher.KubernetesDefaultServiceAccount) that may be set in the

            configuration for Connect.


            If this value is defined and Connect is configured with

            [`Launcher.KubernetesContentServiceAccountSelection = false`](../admin/appendix/configuration/index.md#Launcher.KubernetesContentServiceAccountSelection) an error will be

            returned.


            Only administrators and publishers can view this value.

            Only administrators can set or change this value.'
          example: rstudio-connect-content
          type:
          - string
          - 'null'
        default_image_name:
          description: 'The default image that will be used when none is defined by the

            bundle''s manifest. A specific image may be selected by setting the

            `environment.image` field in the manifest. If no image is selected

            by the manifest file, then the `default_image_name` is used.

            If a target image is not defined by the manifest, and no

            `default_image_name` is configured, then Connect will select an

            image from the list of configured execution environments.


            If either `environment.identifier` or `environment.image` is specified in

            the bundle''s

            manifest.json then the settings in the manifest are used and the

            content-level default

            settings will be ignored. This allows historical bundle activation to behave

            consistently

            even when the content-level default values may have changed.


            A `null` value is returned when the client does not have sufficient

            rights to see this information.


            Use the `/v1/environments` API endpoints to determine which environments

            are available for content execution.'
          example: rstudio/content-base:r4.1.3-py3.10.11-jammy
          type:
          - string
          - 'null'
        default_environment_guid:
          description: 'The default execution environment that will be used when none is defined by

            the

            bundle''s manifest. A specific execution environment may be selected by

            setting the

            `environment.identifier` field in the manifest. If no execution environment

            is selected

            by the manifest file, then `default_environment_guid` is used to select the

            execution environment. If a target execution environment is not defined by

            the manifest,

            and no `default_environment_guid` is configured, then Connect will select an

            execution environment from the list of configured execution environments.


            If either `environment.identifier` or `environment.image` is specified in

            the bundle''s

            manifest.json then the settings in the manifest are used and the

            content-level default

            settings will be ignored. This allows historical bundle activation to behave

            consistently

            even when the content-level default values may have changed.


            A `null` value is returned when the client does not have sufficient

            rights to see this information.


            Use the `/v1/environments` API endpoints to determine which environments

            are available for content execution.'
          example: 36538b83-ea6d-4839-ae8e-53c52ac5f0bf
          format: uuid
          type:
          - string
          - 'null'
        created_time:
          description: The timestamp (RFC3339) indicating when this content was created.
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        last_deployed_time:
          description: 'The timestamp (RFC3339) indicating when this content last had a

            successful bundle deployment performed.'
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        bundle_id:
          description: 'The identifier for the active deployment bundle. Automatically

            assigned upon the successful deployment of that bundle.'
          example: '101'
          type:
          - string
          - 'null'
        app_mode:
          description: 'The runtime model for this content. Has a value of `unknown` before

            data is deployed to this item. Automatically assigned upon the first

            successful bundle deployment.


            Valid values are:


            * `api` - R code defining a [Plumber API](https://www.rplumber.io/).

            * `jupyter-static` - A [Jupyter

            Notebook](https://jupyter-notebook.readthedocs.io/en/stable/).

            * `jupyter-voila` A [Voila](https://voila.readthedocs.io/en/stable/)

            interactive dashboard.

            * `python-api` - Python code defining a WSGI API (such as

            [Flask](https://palletsprojects.com/p/flask/))

            * `python-bokeh` - Python code defining a [Bokeh

            application](https://bokeh.org/).

            * `python-panel` - Python code defining a [Panel

            application](https://panel.holoviz.org/).

            * `python-dash` - Python code defining a [Dash

            application](https://dash.plotly.com/).

            * `python-fastapi` - Python code defining an ASGI API (such as

            [FastAPI](https://fastapi.tiangolo.com/))

            * `python-gradio` - Python code defining a [Gradio](https://www.gradio.app/)

            application.

            * `python-shiny` - Python code defining a [Shiny

            application](https://shiny.posit.co/py/).

            * `python-streamlit` - Python code defining a [Streamlit

            application](https://streamlit.io/).

            * `quarto-shiny` - A [Quarto](https://quarto.org/) document with a Shiny

            runtime.

            * `quarto-static` - A [Quarto](https://quarto.org/) document or site.

            * `rmd-shiny` - An [R Markdown](https://rmarkdown.rstudio.com/) document

            with a Shiny runtime.

            * `rmd-static` - An [R Markdown](https://rmarkdown.rstudio.com/) document or

            site.

            * `shiny` - R code defining a [Shiny application](https://shiny.posit.co/).

            * `static` - Content deployed without source; often HTML and plots.

            * `tensorflow-saved-model` - A TensorFlow Model API.

            * `unknown` - No known runtime model.'
          example: shiny
          type: string
        content_category:
          description: 'Describes the specialization of the content runtime model.

            Automatically assigned upon the first successful bundle deployment.


            The `content_category` field refines the type of content specified by

            `app_mode`. It is empty by default. The rsconnect R package may assign

            a value when analyzing your content and building its manifest and

            bundle. Plots (images created in the RStudio IDE and presented in the

            "Plots" pane) have an `app_mode` of `static` and receive a

            `content_category` of `plot` to distinguish them from other HTML

            documents. Pinned static data sets have an `app_mode` of `static` and a

            `content_category` of `pin`. Multi-document R Markdown sites have an

            `app_mode` of `rmd-static` and a `content_category` of `site`.

            API content types (such as FastAPI, Flask, or Plumber) that serve as

            MCP servers have a `content_category` of `mcp`. The `mcp` category is

            auto-detected on first deploy but can also be set or cleared via

            [PATCH /v1/content/{guid}](#updateContent).'
          example: site
          type: string
        parameterized:
          description: 'True when R Markdown rendered content allows parameter

            configuration. Automatically assigned upon the first successful

            bundle deployment. Applies only to content with an `app_mode` of

            `rmd-static`.'
          example: false
          type: boolean
        environment_guid:
          description: 'The guid of the execution environment used to run this content. Content

            running locally

            on the same server as Connect will have either a `null` value.


            A `null` value is returned when the client does not have sufficient rights

            to see this

            information.'
          example: 36538b83-ea6d-4839-ae8e-53c52ac5f0bf
          format: uuid
          type:
          - string
          - 'null'
        cluster_name:
          description: 'The location where this content runs. Content running on the same

            server as Connect will have either a `null` value or the string

            "Local". Gives the name of the cluster when run external to the

            Connect host.


            A `null` value is returned when the client does not have sufficient

            rights to see this information.'
          example: Local
          type:
          - string
          - 'null'
        image_name:
          description: 'The name of the container image used to run this content in containerized

            environments such as Kubernetes. Content running locally

            on the same server as Connect will have either a `null` value or the string

            "Local".


            A `null` value is returned when the client does not have sufficient

            rights to see this information.'
          example: rstudio/content-base:r4.1.3-py3.10.11-jammy
          type:
          - string
          - 'null'
        r_version:
          description: 'The of R interpreter associated with this content. A `null` value

            represents that R is not used by this content, that the content has

            not been prepared for execution, or that the client does not have

            sufficient rights to see this information. Automatically assigned

            upon the successful deployment of a bundle.'
          example: 3.5.1
          type:
          - string
          - 'null'
        py_version:
          description: 'The version of Python associated with this content. A `null` value

            represents that Python is not used by this content, that the content

            has not been prepared for execution, or that the client does not

            have sufficient rights to see this information. Automatically

            assigned upon the successful deployment of a bundle.'
          example: 3.8.2
          type:
          - string
          - 'null'
        quarto_version:
          description: 'The version of Quarto associated with this content. A `null`

            represents that Quarto is not used by this content, that the content

            has not been prepared for execution, or that the client does not

            have sufficient rights to see this information. Automatically

            assigned upon the successful deployment of a bundle.'
          example: 0.2.22
          type:
          - string
          - 'null'
        node_version:
          description: 'The version of Node.js associated with this content. A `null`

            represents that Node.js is not used by this content, that the content

            has not been prepared for execution, or that the client does not

            have sufficient rights to see this information. Automatically

            assigned upon the successful deployment of a bundle.'
          example: 22.11.0
          type:
          - string
          - 'null'
        r_environment_management:
          description: 'Indicates whether or not Connect is managing an R environment and

            has installed the required packages for this content. A `null` value

            represents that R is not used by this content, that the content has

            not been prepared for execution, or that the client does not have

            sufficient rights to see this information. Automatically assigned

            upon the successful deployment of a bundle.'
          example: true
          type:
          - boolean
          - 'null'
        default_r_environment_management:
          description: 'Indicates whether or not Connect should create and manage an R

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.


            A `null` value is also returned when the client does not have

            sufficient rights to see this information.


            This value is ignored if the server setting

            [`Applications.DefaultEnvironmentManagementSelection`](../admin/appendix/configuration/index.md#Applications.DefaultEnvironmentManagementSelection) is disabled.'
          example: true
          type:
          - boolean
          - 'null'
        py_environment_management:
          description: 'Indicates whether or not Connect is managing a Python environment

            and has installed the required packages for this content. A `null`

            value represents that Python is not used by this content, that the

            content has not been prepared for execution, or that the client does

            not have sufficient rights to see this information. Automatically

            assigned upon the successful deployment of a bundle.'
          example: true
          type:
          - boolean
          - 'null'
        default_py_environment_management:
          description: 'Indicates whether or not Connect should create and manage a Python

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.


            A `null` value is also returned when the client does not have

            sufficient rights to see this information.


            This value is ignored if the server setting

            [`Applications.DefaultEnvironmentManagementSelection`](../admin/appendix/configuration/index.md#Applications.DefaultEnvironmentManagementSelection) is disabled.'
          example: true
          type:
          - boolean
          - 'null'
        run_as:
          description: 'The UNIX user that executes this content. When `null`, the default

            [`Applications.RunAs`](../admin/appendix/configuration/index.md#Applications.RunAs) is used. Applies only to executable content

            types - not `static`.


            Only administrators can change this value.


            If [`Applications.RunAsEnabled = false`](../admin/appendix/configuration/index.md#Applications.RunAsEnabled), this value will be ignored when

            executing content.'
          example: rstudio-connect
          type:
          - string
          - 'null'
        run_as_current_user:
          description: 'Indicates that Connect should run processes for this content item

            under the Unix account of the user who visits it. Content accessed

            anonymously will continue to run as the specified `run_as` user.


            Connect must be configured with the server setting

            [`Applications.RunAsCurrentUser = true`](../admin/appendix/configuration/index.md#Applications.RunAsCurrentUser). Current user execution is

            supported with the PAM, OAuth2, SAML, and LDAP authentication

            providers; PAM additionally requires [`PAM.ForwardPassword = true`](../admin/appendix/configuration/index.md#PAM.ForwardPassword).


            This setting applies to application content types (Shiny, Dash,

            Streamlit, Bokeh, and Panel) and API content types (Plumber, Flask,

            FastAPI, and Node.js).


            Only administrators can change this value.'
          example: false
          type: boolean
        metrics_collection_enabled:
          description: 'Controls whether per-job resource metrics (CPU, memory, connections)

            are collected for this content item.


            When `null`, the content item inherits the server-wide default from

            [`Applications.MetricsCollectionEnabled`](../admin/appendix/configuration/index.md#Applications.MetricsCollectionEnabled). Explicit `true` or `false`

            values override the server default.


            Metrics can be retrieved via the

            [GET /v1/content/{guid}/jobs/{key}/metrics](#getJobMetrics) endpoint.'
          example: true
          type:
          - boolean
          - 'null'
        notify_on_share:
          description: 'Controls whether email notifications are sent by default

            when users or groups are added as collaborators or viewers.


            When `null`, the content item inherits the server-wide default

            from [`Applications.NotifyOnShare`](../admin/appendix/configuration/index.md#Applications.NotifyOnShare). Explicit `true` or `false`

            values override the server default.'
          example: true
          type:
          - boolean
          - 'null'
        otel_enabled:
          description: 'Controls whether content telemetry (metrics, logs, traces) is collected

            for this content item. Both this field and the server setting

            `OpenTelemetry.AllowContentInstrumentation` must be true for signals to flow.

            Only visible to collaborators and owners.'
          example: false
          type: boolean
        owner_guid:
          description: 'The unique identifier of the user who created this content item.

            Automatically assigned when the content is created.'
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        content_url:
          description: 'The URL associated with this content. Computed from the associated

            GUID for this content.'
          example: https://posit-connect.company.com/content/9d8e7f3e-92e8-4a08-b0ff-196319cc56ae
          type: string
        dashboard_url:
          description: 'The URL within the Connect dashboard where this content can be configured.

            Computed from the GUID for this content.'
          example: https://posit-connect.company.com/connect/#/apps/9d8e7f3e-92e8-4a08-b0ff-196319cc56ae
          type: string
        vanity_url:
          description: 'The vanity URL associated with this content item. Included in responses

            when the vanity URL is set and `include=vanity_url` is provided.'
          example: https://posit-connect.company.com/my-content/
          type: string
        app_role:
          description: 'The relationship of the accessing user to this content. A value of

            `owner` is returned for the content owner. `editor` indicates a

            collaborator. The `viewer` value is given to users who are permitted

            to view the content. A `none` role is returned for administrators

            who cannot view the content but are permitted to view its

            configuration. Computed at the time of the request.'
          example: owner
          type: string
        bookmarked:
          description: 'Indicates whether the requesting user has bookmarked this content

            item. Included in responses when `include=bookmarked` is provided.'
          example: true
          type:
          - boolean
          - 'null'
        schedules:
          description: 'Schedules associated with this content item. Included in responses when

            `include=schedule` is provided.'
          items:
            $ref: '#/components/schemas/ContentSchedule'
          type:
          - array
          - 'null'
        id:
          description: The internal numeric identifier of this content item.
          example: '314'
          type: string
        tags:
          description: 'Tags associated with this content item. Included in responses when

            `include=tags` is provided. Returns an empty array when content has

            no tags.'
          items:
            $ref: '#/components/schemas/Tag'
          type:
          - array
          - 'null'
        owner:
          allOf:
          - $ref: '#/components/schemas/ContentOwner'
          description: 'Basic details about the owner of this content item. Included in

            responses when `include=owner` is provided.'
        public_content_status:
          description: 'Validation status of public interactive content. When validation is

            required by licensing, this will be one of "ok", "warning", or

            "restricted". If licensing does not require validation, it will be

            "unrestricted"; if licensing does not allow public interactive

            content, it will be "unlicensed". If the app has not been made public,

            but public content is permitted, it will be "none".'
          example: unrestricted
          type:
          - string
          - 'null'
      type: object
    AccessTestResult:
      additionalProperties: false
      description: The results of the public access content verification test.
      properties:
        guid:
          description: The unique identifier of this content item.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        url:
          description: 'The URL that was used to test access to this content. Computed from

            the associated GUID for this content or the optional vanity URL.'
          example: https://posit-connect.company.com/content/9d8e7f3e-92e8-4a08-b0ff-196319cc56ae
          type: string
        checked_at:
          description: The timestamp (RFC3339) indicating when the access test was performed.
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
        accessible:
          description: 'Indicates whether or not the test was able to access the content item

            on the public internet.'
          example: false
          type: boolean
        message:
          description: 'An optional informational message with extra details about the test

            result. See the

            [Admin Guide](../admin/licensing/index.md#public-access)

            for additional guidance about specific messages.'
          example: content is not publicly accessible
          type: string
      type: object
    ContentRenderInstructions:
      additionalProperties: false
      description: Instructions for rendering a content item.
      properties:
        variant_key:
          description: 'The key of the variant to render. If not specified, the default

            variant is rendered.'
          example: HidI2Kwq
          type:
          - string
          - 'null'
      type: object
    ContentPackages:
      description: Lists the packages installed for a content item.
      items:
        $ref: '#/components/schemas/Package'
      type: array
    CreateContentInput:
      additionalProperties: false
      description: The content fields that can be specified when creating a content item.
      properties:
        name:
          description: 'A simple identifier. Allows alpha-numeric

            characters, periods (`"."`), hyphens (`"-"`), and underscores (`"_"`).'
          example: quarterly-analysis
          type: string
        title:
          description: The title of this content.
          example: Quarterly Analysis of Team Velocity
          type:
          - string
          - 'null'
        description:
          description: A rich description of this content.
          example: This report calculates per-team statistics ...
          type: string
        access_type:
          description: 'Access type describes how this content manages its viewers. The

            value `all` is the most permissive; any visitor to Posit Connect

            will be able to view this content. The value `logged_in` indicates

            that all Posit Connect accounts may view the content. The `acl`

            value lets specifically enumerated users and groups view the

            content. Users configured as collaborators may always view content.


            Access types may be restricted by the Connect configuration or the

            product license.'
          enum:
          - all
          - logged_in
          - acl
          example: acl
          type: string
        connection_timeout:
          description: 'Maximum number of seconds allowed without data sent or received

            across a client connection. A value of `0` means connections will

            never time-out (not recommended). When `null`, the default

            [`Scheduler.ConnectionTimeout`](../admin/appendix/configuration/index.md#Scheduler.ConnectionTimeout) is used. Applies only to content types

            that are executed on demand.'
          example: 3600
          format: int32
          type:
          - integer
          - 'null'
        read_timeout:
          description: 'Maximum number of seconds allowed without data received from a

            client connection. A value of `0` means a lack of client (browser)

            interaction never causes the connection to close. When `null`, the

            default [`Scheduler.ReadTimeout`](../admin/appendix/configuration/index.md#Scheduler.ReadTimeout) is used. Applies only to content

            types that are executed on demand.'
          example: 3600
          format: int32
          type:
          - integer
          - 'null'
        init_timeout:
          description: 'The maximum number of seconds allowed for an interactive application

            to start. Posit Connect must be able to connect to a newly

            launched application before this threshold has

            elapsed. When `null`, the default [`Scheduler.InitTimeout`](../admin/appendix/configuration/index.md#Scheduler.InitTimeout) is used.

            Applies only to content types that are executed on demand.'
          example: 60
          format: int32
          type:
          - integer
          - 'null'
        idle_timeout:
          description: 'The maximum number of seconds a worker process for an interactive

            application to remain alive after it goes idle (no active

            connections). When `null`, the default [`Scheduler.IdleTimeout`](../admin/appendix/configuration/index.md#Scheduler.IdleTimeout) is

            used. Applies only to content types that are executed on demand.'
          example: 5
          format: int32
          type:
          - integer
          - 'null'
        max_processes:
          description: 'Specifies the total number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default [`Scheduler.MaxProcesses`](../admin/appendix/configuration/index.md#Scheduler.MaxProcesses) is used. Applies only to

            content types that are executed on demand.'
          example: 3
          format: int32
          type:
          - integer
          - 'null'
        min_processes:
          description: 'Specifies the minimum number of concurrent processes allowed for a

            single interactive application per Posit Connect node. When `null`,

            the default `Scheduler.MinProcesses` is used. Applies only to

            content types that are executed on demand.'
          example: 0
          format: int32
          type:
          - integer
          - 'null'
        max_conns_per_process:
          description: 'Specifies the maximum number of client connections allowed to an

            individual process. Incoming connections which will exceed this

            limit are routed to a new process or rejected. When `null`, the

            default [`Scheduler.MaxConnsPerProcess`](../admin/appendix/configuration/index.md#Scheduler.MaxConnsPerProcess) is used. Applies only to

            content types that are executed on demand.'
          example: 20
          format: int32
          type:
          - integer
          - 'null'
        load_factor:
          description: 'Controls how aggressively new processes are spawned. When `null`,

            the default [`Scheduler.LoadFactor`](../admin/appendix/configuration/index.md#Scheduler.LoadFactor) is used. Applies only to content

            types that are executed on demand.'
          example: 0.5
          format: double
          type:
          - number
          - 'null'
        default_r_environment_management:
          description: 'Indicates whether or not Connect should create and manage an R

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.'
          example: true
          type:
          - boolean
          - 'null'
        default_py_environment_management:
          description: 'Indicates whether or not Connect should create and manage a Python

            environment (installing required packages) for this content. When

            `null`, Connect makes this determination based on the server

            configuration.'
          example: true
          type:
          - boolean
          - 'null'
        run_as:
          description: 'The UNIX user that executes this content. When `null`, the default

            [`Applications.RunAs`](../admin/appendix/configuration/index.md#Applications.RunAs) is used. Applies only to executable content

            types - not `static`.'
          example: rstudio-connect
          type:
          - string
          - 'null'
        run_as_current_user:
          description: 'Indicates that Connect should run processes for this content item

            under the Unix account of the user who visits it. Content accessed

            anonymously will continue to run as the specified `run_as` user.'
          example: false
          type:
          - boolean
          - 'null'
        memory_request:
          description: 'The minimum amount of RAM this content needs when executing or

            rendering, expressed in bytes. When `null`, the default

            [`Scheduler.MemoryRequest`](../admin/appendix/configuration/index.md#Scheduler.MemoryRequest) is used.'
          example: 1073741824
          format: int64
          type:
          - integer
          - 'null'
        memory_limit:
          description: 'The maximum amount of RAM this content will be allowed to consume

            when executing or rendering, expressed in bytes. When `null`, the

            default [`Scheduler.MemoryLimit`](../admin/appendix/configuration/index.md#Scheduler.MemoryLimit) is used.'
          example: 2147483648
          format: int64
          type:
          - integer
          - 'null'
        cpu_request:
          description: 'The minimum amount of compute power this content needs when executing

            or rendering, expressed in CPU Units, where 1.0 unit is equivalent to

            1 physical or virtual core. Fractional values are allowed. When `null`,

            the default [`Scheduler.CPURequest`](../admin/appendix/configuration/index.md#Scheduler.CPURequest) is used.'
          example: 1
          format: double
          type:
          - number
          - 'null'
        cpu_limit:
          description: 'The maximum amount of compute power this content will be allowed to

            consume when executing or rendering, expressed in CPU Units. When

            `null`, the default [`Scheduler.CPULimit`](../admin/appendix/configuration/index.md#Scheduler.CPULimit) is used.'
          example: 1.5
          format: double
          type:
          - number
          - 'null'
        amd_gpu_limit:
          description: 'The number of AMD GPUs allocated to run this content. When `null`,

            the default [`Scheduler.AMDGPULimit`](../admin/appendix/configuration/index.md#Scheduler.AMDGPULimit) is used.'
          example: 1
          format: int64
          type:
          - integer
          - 'null'
        nvidia_gpu_limit:
          description: 'The number of NVIDIA GPUs allocated to run this content. When `null`,

            the default [`Scheduler.NvidiaGPULimit`](../admin/appendix/configuration/index.md#Scheduler.NvidiaGPULimit) is used.'
          example: 1
          format: int64
          type:
          - integer
          - 'null'
        service_account_name:
          description: The name of the Kubernetes service account used to run this content.
          example: rstudio-connect-content
          type:
          - string
          - 'null'
        default_image_name:
          description: 'The default container image used when none is defined by the bundle''s

            manifest.'
          example: rstudio/content-base:r4.1.3-py3.10.11-jammy
          type:
          - string
          - 'null'
        default_environment_guid:
          description: 'The default execution environment used when none is defined by the

            bundle''s manifest.'
          example: 36538b83-ea6d-4839-ae8e-53c52ac5f0bf
          format: uuid
          type:
          - string
          - 'null'
        metrics_collection_enabled:
          description: 'Controls whether per-job resource metrics are collected for this

            content item. When `null`, inherits the server-wide default.'
          example: true
          type:
          - boolean
          - 'null'
        notify_on_share:
          description: 'Controls whether email notifications are sent by default when

            users or groups are added as collaborators or viewers.

            When `null`, inherits the server-wide default from

            [`Applications.NotifyOnShare`](../admin/appendix/configuration/index.md#Applications.NotifyOnShare).'
          example: true
          type:
          - boolean
          - 'null'
        otel_enabled:
          description: Controls whether content telemetry is collected for this content item.
          example: false
          type:
          - boolean
          - 'null'
      type: object
    ContentDeploymentTask:
      additionalProperties: false
      description: Identifies the task that can be used to track the progress of a deployment operation.
      properties:
        task_id:
          description: Identifier for the created deployment task.
          example: M49MsuXt6XVzlRdL
          type: string
      type: object
    ContentOwner:
      additionalProperties: false
      description: Basic details about the owner of a content item.
      properties:
        guid:
          description: The owner's unique identifier.
          example: 25438b83-ea6d-4839-ae8e-53c52ac5f9ce
          format: uuid
          type: string
        username:
          description: The owner's username.
          example: jondoe
          type:
          - string
          - 'null'
        first_name:
          description: The owner's first name.
          example: Jon
          type:
          - string
          - 'null'
        last_name:
          description: The owner's last name.
          example: Doe
          type:
          - string
          - 'null'
      type: object
    ContentSchedule:
      allOf:
      - $ref: '#/components/schemas/Schedule'
      - properties:
          variant:
            allOf:
            - $ref: '#/components/schemas/ScheduleVariant'
        type: object
      description: Schedule information with variant details for a content item.
    Schedule:
      description: Base schedule information for a content item.
      properties:
        type:
          description: The schedule type.
          example: rrule
          type: string
        schedule:
          allOf:
          - $ref: '#/components/schemas/RRuleSet'
          description: The recurrence rule in RFC5545 format.
        next_run:
          description: The next scheduled run time. Null if no future runs are scheduled.
          format: date-time
          type:
          - string
          - 'null'
        email:
          description: Whether email notifications are enabled for this schedule.
          example: false
          type: boolean
        timezone:
          description: The timezone for this schedule.
          example: America/New_York
          type: string
        start_time:
          description: The start time of the schedule window.
          format: date-time
          type:
          - string
          - 'null'
        end_time:
          description: The end time of the schedule window. Null if the schedule runs indefinitely.
          format: date-time
          type:
          - string
          - 'null'
        last_run:
          allOf:
          - $ref: '#/components/schemas/ScheduleLastRun'
          description: Information about the last scheduled run.
      type: object
    EnvironmentVariable:
      additionalProperties: false
      description: Defines an environment variable and its value.
      properties:
        name:
          description: Name of the environment variable.
          example: DEBUG
          type: string
        value:
          description: 'New value of the environment variable.

            A value of `null` will delete the environment variable.'
          example: '1'
          type:
          - string
          - 'null'
      type: object
    OAuthIntegrationAssociationOutput:
      additionalProperties: false
      description: Represents an association between a content item and an OAuth integration.
      properties:
        app_guid:
          description: This field is deprecated and has been renamed to `content_guid`.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        content_guid:
          description: The unique identifier of the content item.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        oauth_integration_guid:
          description: The unique identifier of an existing OAuth integration.
          example: f4b3d7f6-7e1d-4f3b-8b9e-3f0f3f3f3f3f
          format: uuid
          type: string
        oauth_integration_name:
          description: A descriptive name that identifies the OAuth integration.
          example: Databricks Integration
          type:
          - string
          - 'null'
        oauth_integration_description:
          description: A brief text that describes the OAuth integration.
          example: Integration with external system
          type:
          - string
          - 'null'
        oauth_integration_template:
          description: The template used to configure this OAuth integration.
          example: custom
          type:
          - string
          - 'null'
        oauth_integration_auth_type:
          description: 'Indicates which OAuth flow is used by this integration. The

            "Viewer" authentication type corresponds to the Authorization Code

            flow. The "Service Account" authentication type corresponds to the

            Client Credentials flow.'
          example: Viewer
          type:
          - string
          - 'null'
        created_time:
          description: The timestamp (RFC3339) indicating when this association was created.
          example: '2006-01-02T15:04:05-07:00'
          format: date-time
          type: string
      type: object
    Tag:
      additionalProperties: false
      description: A tag used to organize content within Connect.
      properties:
        id:
          description: The identifier for the tag.
          example: '101'
          type: string
        name:
          description: The name of the tag.
          example: financial-statements
          type: string
        parent_id:
          description: 'The identifier for the parent tag. If there is no parent_id,

            the tag is a top-level tag.'
          example: '102'
          type:
          - string
          - 'null'
        created_time:
          description: The timestamp (RFC3339) indicating when the tag was created.
          example: '2006-01-02T15:04:05Z'
          format: date-time
          type: string
        updated_time:
          description: The timestamp (RFC3339) indicating when the tag was updated.
          example: '2006-01-02T15:04:05Z'
          format: date-time
          type: string
      type: object
    ContentBuildTask:
      additionalProperties: false
      description: Identifies the task that can be used to track the progress of a build operation.
      properties:
        task_id:
          description: Identifier for the created build task.
          example: M49MsuXt6XVzlRdL
          type: string
      type: object
    EnvironmentVariableNames:
      description: List of environment variable names, without values.
      items:
        type: string
      type: array
  securitySchemes:
    apiKey:
      description: 'Prefix your API key with `Key `, e.g. `Key ABC123`.

        '
      in: header
      name: Authorization
